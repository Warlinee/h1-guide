<meta name="description" content="1. 彻底关闭启动器。 2. 打开你的游戏文件夹（有 H1Z1.exe 的那个）。 3. 复制 vivoxsdk_x64.original.dll 并粘贴到同一个文件夹里，然后把这个副本重命名为 vivoxsdk_x64.dll 即可。 4. 没有 .original.dll 文件？那就从 Steam 里的游戏文件夹拿一份 vivoxsdk_x64.dll 过来。 5. 把游戏文件夹加到杀毒软件的排除项里，免得问题再出现。">
