<meta name="description" content="1. ROTK 禁止使用 ReShade（官方人员已于 10 月 19 日确认）。卸载它，并把它的文件从游戏文件夹里删掉。 2. 也不要用其他会注入游戏的工具（滤镜、游戏内翻译工具……）。 3. 想要颜色更好看：用显卡的鲜艳度设置（NVIDIA：数字振动控制，AMD：饱和度），它不会动到游戏。">
