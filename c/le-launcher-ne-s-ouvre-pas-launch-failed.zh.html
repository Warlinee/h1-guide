<meta name="description" content="1. 部分电脑上的已知问题，暂无修复。 2. 以管理员身份打开“命令提示符”：按 Windows 键，输入 cmd，然后右键 &gt; “以管理员身份运行”。 3. 粘贴下面这一行（引号也要带上），然后按 Enter：&quot;C:\Program Files\ROTK Launcher\ROTK Launcher.exe&quot; --no-sandbox 4. 这是默认路径。如果启动器装在别处：右键点击桌面上的 ROTK Launcher 快捷方式 &gt; “打开文件所在的位置”，然后把这行里的 C:\Program Files\ROTK Launcher 换成打开的那个文件夹的路径（看“地址栏”）。">
