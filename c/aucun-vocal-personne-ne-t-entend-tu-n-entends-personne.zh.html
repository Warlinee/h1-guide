<meta name="description" content="1. 如果语音刚断开，等一分钟：它会自己尝试重连，前后大约十分钟内会试好几次。 2. 还是不行：彻底关掉游戏，再从启动器重新启动。 3. 启动器显示“The legacy Vivox SDK could not be found”：按 Vivox 那个条目操作。 4. 还是不行：在启动器设置里勾选“调试并发送会话报告”（Debug and send session reports），打一局后关掉游戏，然后到 Discord 的求助频道把启动器显示的报告编号发给管理员。">
