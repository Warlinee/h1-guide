<title>0xC0000005 崩溃，地址 0x2a31abc · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 在 Steam 里验证 H1Z1 的文件（右键点击游戏 &gt; “属性” &gt; “已安装文件” &gt; “验证游戏文件的完整性”）。 2. 在启动器里重新进行客户端安装：“H1Z1 客户端”（H1Z1 CLIENT）选你 Steam 里的游戏文件夹，“ROTK 安装位置”（ROTK INSTALLATION）选一个新的空文件夹，比如 C:\Games\ROTK2 这种（不要用“下载”、“桌面”或 OneDrive）。游戏会装到 C:\Games\ROTK2\ROTK 里，ROTK 这个文件夹是启动器自己加上的。 3. 点击“创建独立副本”（CREATE SEPARATE COPY），等复制完成。">
