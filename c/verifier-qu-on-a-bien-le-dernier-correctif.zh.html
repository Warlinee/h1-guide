<title>确认你装的是最新补丁 · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 看启动器右上角、“最小化”按钮旁边的版本号：“版本 2.0.45”（BUILD 2.0.45）。以这个为准。 2. 版本更旧的话：先更新启动器，然后彻底关闭游戏，再重新启动。 3. 确认游戏补丁是否生效：启动游戏后，打开你的游戏文件夹，右键点击 rotk-shotgun-sprint.ini &gt; “打开方式” &gt; “记事本”。 4. 如果 proxySha256= 这一行以 3D2319E6 开头，那就是 2.0.45 的游戏补丁。如果以 FFE3456B（2.0.44）或 7DE5B115（2.0.43）开头，就用更新后的启动器重新启动游戏。">
