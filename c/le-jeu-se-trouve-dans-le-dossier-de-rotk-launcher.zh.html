<meta name="description" content="1. 关闭启动器。 2. 在“文件资源管理器”里进入 C:\Program Files\ROTK Launcher 文件夹，把 ROTK 文件夹剪切，粘贴到 C:\Games 里。 3. 打开启动器：客户端安装 &gt; “选择”（CHOOSE） &gt; C:\Games\ROTK &gt; “使用此客户端”（USE THIS CLIENT）。 4. 再运行一次更新。">
