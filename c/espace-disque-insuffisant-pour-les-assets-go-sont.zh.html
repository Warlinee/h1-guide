<title>“Not enough disk space for the assets: … GB is required”（资源文件所需的磁盘空间不足） · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 下载资源文件之前，启动器要求游戏所在的磁盘上有资源文件大小 3 倍的可用空间：它要先下载、再解压，还要保留一份被替换文件的备份。 2. 第一次安装：大约要下载 5 GB，所以需要 15 GB 可用空间。10 月 22 日的资源更新：1.7 GB，所以需要 5 GB 可用空间。 3. 在这个磁盘上腾出空间，然后再点一次“开始游戏”（PLAY）。 4. 实在腾不出足够空间：换一个磁盘重新进行客户端安装，选 D:\Games 这样的文件夹（看“客户端安装：该选哪个文件夹？”条目）。新磁盘上需要有 Steam 里游戏文件夹的大小再加 15 GB 的可用空间，因为所有资源文件都要重新安装。">
