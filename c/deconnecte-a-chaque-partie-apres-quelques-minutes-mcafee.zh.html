<title>每局玩几分钟就掉线（McAfee） · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 按 Windows 键，输入“McAfee”：能搜到就说明装了。新电脑经常预装 McAfee 试用版。 2. Windows 设置 &gt; 应用 &gt; 已安装的应用：搜索“McAfee”，点右边的“…” &gt; 卸载。 3. 每个 McAfee 条目都这样卸载一遍（包括 WebAdvisor），然后重启电脑。 4. 重启后 Windows Defender 会自动重新开启。再打开启动器，玩 2、3 局试试。">
