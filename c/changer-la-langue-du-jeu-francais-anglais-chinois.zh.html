<meta name="description" content="1. 从 2.0.44 版启动器开始，游戏使用启动器的语言：启动器是法语，游戏就是法语，“社交”面板也一样。英语和中文也是这样。 2. 更改方法：点启动器右上角、“版本”（BUILD）左边的国旗，然后选择你的语言。 3. 彻底关闭游戏，再从启动器重新启动：下次启动时语言就会改变。">
