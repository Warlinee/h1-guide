<title>启动器里出现“fetch failed” · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 按 Windows + R，输入 ncpa.cpl 后回车。 2. 右键你正在用的网卡（以太网或 WLAN）&gt; 属性。 3. 双击以 (TCP/IPv4) 结尾的那一行。 4. 选“使用下面的 DNS 服务器地址”，首选 DNS 服务器填 223.5.5.5，备用 DNS 服务器填 119.29.29.29，然后点确定，再点关闭。 5. 按 Windows + R，输入 cmd 后回车。在黑色窗口里输入 ipconfig /flushdns 再回车：Windows 会清掉之前失败的记录。 6. 关掉启动器再重新打开，然后再点一次“开始游戏”（PLAY）。">
