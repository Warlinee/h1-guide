<title>启动器里出现“fetch failed” · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 按 Windows + R，输入 ncpa.cpl 后回车，会打开“网络连接”窗口。 2. 右键你正在用的连接（以太网或 WLAN）&gt; 属性。 3. 双击“Internet 协议版本 4 (TCP/IPv4)”。 4. 选“使用下面的 DNS 服务器地址”，首选 DNS 服务器填 1.1.1.1，备用 DNS 服务器填 1.0.0.1，然后点确定，再点关闭。 5. 关掉启动器再重新打开，然后再点一次“开始游戏”（PLAY）。">
