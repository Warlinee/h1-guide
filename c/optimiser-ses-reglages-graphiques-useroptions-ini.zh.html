<title>用 UserOptions.ini 优化画面设置 · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 打开 AngA 的设置工具：https://dl.anga.tv/H1z1/ROTK.html 2. 选择你的 UserOptions.ini 文件，它在游戏文件夹里（例如 C:\Games\ROTK ）。文件只在你的电脑上读取，什么都不会上传。 3. 选择你的方案：你的电脑性能如何，以及你想要什么（可见度、帧数、响应速度或画质）。 4. 关掉游戏，先备份旧文件，再用工具生成的文件替换它。你的灵敏度、按键、音效和 FOV 设置都会保留。">
