<meta name="description" content="1. 原因：你的浏览器会跟随 Windows 的“动画效果”选项。这个选项关闭时，rotk.app 会跳过“Let it roll”转盘，直接显示你开到的东西。 2. 打开 Windows 设置（Win + I）&gt; 辅助功能 &gt; 视觉效果。 3. 打开“动画效果”。 4. 刷新 rotk.app 页面（F5），进入 Inventory &gt; Crates，选中你的箱子，点击“Open”，再点“Open one”：转盘会先转起来，然后才显示你的皮肤。">
