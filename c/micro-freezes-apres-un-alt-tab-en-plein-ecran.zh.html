<title>全屏时 Alt+Tab 后出现微卡顿 · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 最简单的办法：Alt+Tab 之后重启游戏，或者对局中别切出去。 2. 右键点击游戏文件夹里的 H1Z1.exe &gt; 属性 &gt; “兼容性”选项卡：勾选“禁用全屏优化”。 3. 想不用全屏又保留拉伸画面：先把 Windows 桌面分辨率设为 1440x1080（在 NVIDIA 控制面板里设为全屏缩放、由 GPU 执行缩放），再把游戏设为“全屏窗口模式”（Fullscreen Windowed，无边框）。">
