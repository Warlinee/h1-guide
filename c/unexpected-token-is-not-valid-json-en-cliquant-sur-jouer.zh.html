<title>点“开始游戏”时提示“Unexpected token … is not valid JSON” · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 彻底关闭启动器。 2. 按 Windows + R，粘贴 %APPDATA%\ROTK Launcher\logs 然后点“确定”。 3. 打开那个名字很奇怪的文件夹（一长串字母和数字），再打开 input-profile 文件夹。 4. 右键点击 weapon-stance.v1.json &gt; “重命名”，在末尾加上 .old（变成 weapon-stance.v1.json.old），然后重新打开启动器。">
