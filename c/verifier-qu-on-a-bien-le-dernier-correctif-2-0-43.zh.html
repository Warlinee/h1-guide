<meta name="description" content="1. 看启动器右上角、“最小化”按钮旁边的版本号：“版本 2.0.43”（BUILD 2.0.43）。以这个为准。 2. 版本更旧的话：先更新启动器，然后彻底关闭游戏，再重新启动。 3. 确认游戏补丁是否生效：启动游戏后，打开你的游戏文件夹，右键点击 rotk-shotgun-sprint.ini &gt; “打开方式” &gt; “记事本”。 4. 如果 proxySha256= 这一行以 7DE5B115 开头，那就是 2.0.43 的游戏补丁。">
