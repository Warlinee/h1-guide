<title>“Asset download refused (HTTP 504)”（资源下载被拒绝，HTTP 504） · ROTK Wiki（非官方）</title>
<meta name="description" content="1. 不是你电脑的问题：资源服务器没有及时响应，比如大更新刚发布、所有人同时下载的时候。 2. 彻底关闭启动器（任务管理器 &gt; 详细信息 &gt; ROTK Launcher.exe &gt; “结束任务”），重新打开后点“开始游戏”（PLAY）。 3. 还是报错：过 2-3 分钟再点一次“开始游戏”。已经下载完的资源包会保留，下载会从中断的地方继续。 4. 试了几次还是卡住：看看 Discord 上的公告，可能是服务器出了问题。">
