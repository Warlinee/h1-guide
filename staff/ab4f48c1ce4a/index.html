<head>
<meta charset="utf-8">

<title>Accès staff</title>
<style>
:root { --bg: #0c0a0a; --text: #f3efec; --muted: #a39b97; --line: #2c2624; --red: #e10600; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
main { min-height: 100dvh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
form { width: 100%; max-width: 360px; border: 1px solid var(--line); border-top: 3px solid var(--red); padding: 24px; background: #141110; }
h1 { font-size: 20px; margin: 0 0 6px; }
p { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
input { width: 100%; box-sizing: border-box; padding: 11px 12px; background: #0c0a0a; border: 1px solid var(--line); color: var(--text); font: inherit; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
button { margin-top: 12px; width: 100%; padding: 11px; background: var(--red); color: #fff; border: 0; font: 600 15px system-ui, sans-serif; cursor: pointer; }
#err { color: var(--red); min-height: 20px; margin: 10px 0 0; font-size: 14px; }
</style>
</head>
<body>
<main>
<form id="f">
  <h1>Document interne au staff</h1>
  <p>Entre le mot de passe reçu en message privé.</p>
  <label for="pw" style="position:absolute;left:-9999px">Mot de passe</label>
  <input id="pw" type="password" autocomplete="off" required>
  <button type="submit">Ouvrir</button>
  <p id="err" role="alert"></p>
</form>
</main>
