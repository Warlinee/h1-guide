 f:{fr:["Le dossier du launcher (C:\\Program Files\\ROTK Launcher) n'est pas le dossier du jeu.","Explorateur > Ce PC > recherche rotk-shotgun-sprint.ini > clic droit > « Ouvrir l'emplacement du fichier » : c'est ton dossier de jeu.",".ROTK-assets est un cran au-dessus, juste à côté du dossier du jeu."],en:["The launcher folder (C:\\Program Files\\ROTK Launcher) is not the game folder.","File Explorer > This PC > search rotk-shotgun-sprint.ini > right-click > \"Open file location\": that's your game folder.",".ROTK-assets is one level up, right next to the game folder."]},
 n:{fr:"Le schéma complet est dans la section « Où est ton jeu ? », en haut de la page.",en:"The full diagram is in the \"Where is your game?\" section, at the top of the page."},
 m:{fr:"le dossier du launcher (program files) c'est pas celui du jeu. dans l'explorateur, clique sur ce pc et cherche rotk-shotgun-sprint.ini, clic droit > ouvrir l'emplacement : c'est ton dossier de jeu. .ROTK-assets est juste à côté, un cran au-dessus",en:"the launcher folder (program files) isn't the game folder. in file explorer, click this pc and search rotk-shotgun-sprint.ini, right-click > open file location: that's ur game folder. .ROTK-assets is right next to it, one level up"}},
{c:"launcher", s:"ok", k:["Program Files\\ROTK Launcher\\ROTK"], v:"movegame",
 t:{fr:"« Le jeu se trouve dans le dossier de ROTK Launcher »",en:"\"The game is inside the ROTK Launcher folder\""},
 f:{fr:["Ferme le launcher.", "Dans l'Explorateur, va dans C:\\Program Files\\ROTK Launcher, coupe le dossier ROTK et colle-le dans C:\\Games.", "Rouvre le launcher : installation du client > Choisir > C:\\Games\\ROTK > Utiliser ce client.", "Relance la mise à jour."],en:["Close the launcher.", "In File Explorer, go to C:\\Program Files\\ROTK Launcher, cut the ROTK folder and paste it into C:\\Games.", "Open the launcher: client setup > Choose > C:\\Games\\ROTK > Use this client.", "Run the update again."]},
 n:{fr:"Chaque mise à jour efface ce dossier, d'où le blocage. Rien n'a été supprimé.",en:"Every update wipes that folder, hence the block. Nothing was deleted."},
 m:{fr:"ton jeu est dans le dossier du launcher, la maj s'arrête pour pas l'effacer. déplace C:\\Program Files\\ROTK Launcher\\ROTK vers C:\\Games\\ROTK, resélectionne-le dans le launcher et relance la maj",en:"ur game is inside the launcher folder, the update stops so it doesn't delete it. move C:\\Program Files\\ROTK Launcher\\ROTK to C:\\Games\\ROTK, select it again in the launcher and rerun the update"}},
{c:"launcher", s:"ok", k:["H1Z1 CLIENT","STEAM CLIENT DETECTED","STANDALONE"], v:"client",
 t:{fr:"Installation du client : quel dossier choisir ?",en:"Client setup: which folder to pick?"},
 f:{fr:["« CLIENT H1Z1 » : ton dossier Steam du jeu. Pour le trouver : Steam > clic droit sur Z1 Battle Royale > Gérer > Parcourir les fichiers locaux. Le launcher doit afficher « CLIENT STEAM DÉTECTÉ ».", "« INSTALLATION ROTK » : un dossier hors de Steam, par exemple C:\\Games (le dossier ROTK se crée tout seul dedans). Jamais C:\\ ou D:\\ tout seul, ni un dossier ROTK posé directement sur le disque comme D:\\ROTK (pour l'instant, en launcher 2.0.43, ça bloque avec « Accès refusé », EPERM).", "Clique sur « Créer une copie séparée » et attends la fin de la copie.", "« CLIENT ISOLÉ DÉTECTÉ » alors que tu voulais Steam : tu as choisi une ancienne copie. Reprends le dossier Steam du jeu."],en:["\"H1Z1 CLIENT\": your Steam game folder. To find it: Steam > right-click Z1 Battle Royale > Manage > Browse local files. The launcher should say \"STEAM CLIENT DETECTED\".", "\"ROTK INSTALLATION\": a folder outside Steam, for example C:\\Games (the ROTK folder is created inside it for you). Never just C:\\ or D:\\, or a ROTK folder sitting right on the drive like D:\\ROTK (for now, on launcher 2.0.43, that fails with \"Access denied\", EPERM).", "Click \"Create separate copy\" and wait for the copy to finish.", "\"STANDALONE CLIENT DETECTED\" when you wanted Steam: you picked an old copy. Pick the Steam game folder instead."]},
 n:{fr:"H1Z1 s'appelle « Z1 Battle Royale » sur Steam (gratuit).",en:"H1Z1 is called \"Z1 Battle Royale\" on Steam (free)."},
 m:{fr:"dans \"H1Z1 client\" mets ton dossier steam de h1z1, et pour l'installation rotk un dossier vide hors de steam genre C:\\Games",en:"for \"H1Z1 client\" pick ur steam h1z1 folder, and for the rotk install an empty folder outside steam like C:\\Games"}},
{c:"launcher", s:"ok", k:["marqueur","marker is missing"], v:"client",
 t:{fr:"« L'installation ROTK est incomplète : son marqueur est introuvable »",en:"\"The ROTK installation is incomplete: its marker is missing\""},
 f:{fr:["Le launcher pointe vers un dossier qui n'existe plus, ou vers une copie rangée dans Steam.", "Dans le launcher, ouvre l'installation du client.", "« CLIENT H1Z1 » = ton dossier Steam du jeu, « INSTALLATION ROTK » = un dossier vide hors de Steam (ex. C:\\Games), puis « Créer une copie séparée »."],en:["The launcher points to a folder that's gone, or to a copy stored inside Steam.", "In the launcher, open the client setup.", "\"H1Z1 CLIENT\" = your Steam game folder, \"ROTK INSTALLATION\" = an empty folder outside Steam (e.g. C:\\Games), then \"Create separate copy\"."]},
 m:{fr:"ton launcher pointe vers un dossier qui existe plus. refais l'installation du client vers un dossier vide genre C:\\Games\\ROTK2",en:"ur launcher points to a folder that's gone. redo the client setup into an empty folder like C:\\Games\\ROTK2"}},
{c:"launcher", s:"ok", k:["IN GAME"], v:"ingame",
 t:{fr:"Le bouton affiche « IN GAME » alors que le jeu est fermé",en:"The button shows \"IN GAME\" but the game is closed"},
 f:{fr:["Ouvre le Gestionnaire des tâches (Ctrl + Maj + Échap), onglet Détails.", "Clic droit sur H1Z1.exe et sur chaque ROTK Launcher.exe > Fin de tâche.", "Rouvre le launcher. Rien dans la liste : redémarre le PC."],en:["Open Task Manager (Ctrl + Shift + Esc), Details tab.", "Right-click H1Z1.exe and every ROTK Launcher.exe > End task.", "Open the launcher again. Nothing in the list: restart the PC."]},
 n:{fr:"En français, le bouton affiche « EN JEU ».",en:"In French, the button says \"EN JEU\"."},
 m:{fr:"le launcher croit que le jeu tourne encore. gestionnaire des tâches > détails, termine H1Z1.exe et ROTK Launcher.exe, sinon redémarre",en:"the launcher thinks the game is still running. task manager > details, end H1Z1.exe and ROTK Launcher.exe, or restart"}},
{c:"launcher", s:"ok", k:["UPDATING ASSETS","0%","1%","INSTALLING",".ROTK-assets","fetch failed","retélécharge","à chaque lancement","redownload","every launch"], v:"assets",
 t:{fr:"Les assets restent bloqués à 0 % (ou 1 %)",en:"Assets stuck at 0% (or 1%)"},
 f:{fr:["Clique une seule fois sur Jouer et attends 5 à 10 min : le gros pack fait 1,3 Go et il est vérifié avant de bouger.", "Pendant « INSTALLATION », le pourcentage ne bouge qu'à la fin de chaque pack : c'est normal.", "Toujours bloqué : ferme le launcher, ouvre le dossier .ROTK-assets (juste à côté de ton dossier de jeu), puis asset-cache, supprime tout dedans et relance."],en:["Press Play once and wait 5 to 10 min: the big pack is 1.3 GB and gets checked before it moves.", "During \"INSTALLING\", the percentage only moves when a pack is done: that's normal.", "Still stuck: close the launcher, open the .ROTK-assets folder (right next to your game folder), then asset-cache, delete everything inside and relaunch."]},
 n:{fr:"Il faut 3 fois la taille de la mise à jour en espace libre sur le disque du jeu (5 Go pour celle du 22/10, 15 Go pour une première installation), sinon le launcher affiche « Espace disque insuffisant pour les assets ». Gros téléchargement juste après une mise à jour : c'est normal, seuls les packs modifiés sont retéléchargés (1,7 Go le 22/10). Il retélécharge les mêmes packs à chaque lancement ? Regarde la quarantaine de ton antivirus et ajoute .ROTK-assets en exclusion. Tu ne trouves pas .ROTK-assets ? Regarde la section « Où est ton jeu ? ».",en:"You need 3 times the update size free on the game's drive (5 GB for the 22/10 one, 15 GB for a first install), otherwise the launcher shows \"Not enough disk space for the assets\". A big download right after an update is normal: only the changed packs are downloaded again (1.7 GB on 22/10). It downloads the same packs at every launch? Check your antivirus quarantine and add .ROTK-assets as an exclusion. Can't find .ROTK-assets? Check the \"Where is your game?\" section."},
 r:["espace-disque-insuffisant-pour-les-assets-go-sont"],
 m:{fr:"clique une fois sur jouer et laisse tourner 5-10 min. si t'es toujours à 0 : ferme tout, vide le dossier asset-cache dans .ROTK-assets à côté de ton jeu et relance",en:"press play once and let it run 5-10 min. still at 0: close everything, empty the asset-cache folder in .ROTK-assets next to ur game and relaunch"}},
{c:"launcher", s:"ok", k:["Espace disque insuffisant","Not enough disk space","Go sont nécessaires","GB is required","espace libre","free space"],
 t:{fr:"« Espace disque insuffisant pour les assets : … Go sont nécessaires »",en:"\"Not enough disk space for the assets: … GB is required\""},
 f:{fr:["Avant de télécharger les assets, le launcher veut 3 fois leur taille en espace libre sur le disque du jeu : il les télécharge, les extrait, puis garde une copie des fichiers remplacés.", "Première installation : environ 5 Go à télécharger, donc 15 Go libres. Mise à jour des assets du 22/10 : 1,7 Go, donc 5 Go libres.", "Fais de la place sur ce disque, puis clique à nouveau sur Jouer.", "Pas moyen de libérer assez de place : refais l'installation du client sur un autre disque, dans un dossier comme D:\\Games (fiche « Installation du client : quel dossier choisir ? »). Il te faudra sur ce disque la taille du dossier Steam du jeu plus 15 Go, car tous les assets se réinstallent."],en:["Before downloading the assets, the launcher wants 3 times their size free on the game's drive: it downloads them, extracts them, then keeps a copy of the files it replaces.", "First install: about 5 GB to download, so 15 GB free. 22/10 asset update: 1.7 GB, so 5 GB free.", "Free some space on that drive, then press Play again.", "Can't free enough space: redo the client setup on another drive, in a folder like D:\\Games (\"Client setup: which folder to pick?\" card). You'll need the size of the game's Steam folder plus 15 GB free on that drive, since all the assets get installed again."]},
 n:{fr:"Avec le launcher en anglais, ce message est « Not enough disk space for the assets: … GB is required. », et le launcher en chinois l'affiche aussi en anglais. Pendant la copie du client, c'est un autre message, sans « pour les assets » (en anglais « Not enough disk space: … GB is required. ») : il faut alors la taille du dossier Steam du jeu en espace libre, plus 10 % (au moins 2 Go).",en:"In the French launcher this message reads \"Espace disque insuffisant pour les assets : … Go sont nécessaires.\", and the Chinese launcher shows it in English. During the client copy you get a different one, without \"for the assets\" (\"Espace disque insuffisant : … Go sont nécessaires.\" in French): then you need the size of the game's Steam folder free, plus 10% (at least 2 GB)."},
 r:["installation-du-client-quel-dossier-choisir"],
 m:{fr:"le launcher veut 3 fois la taille du téléchargement en espace libre sur le disque du jeu : 15 Go pour une première installation, 5 Go pour la maj du 22/10. fais de la place sur ce disque puis reclique sur jouer",en:"the launcher wants 3 times the download size free on the game's drive: 15 GB for a first install, 5 GB for the 22/10 update. free some space on that drive then press play again"}},
{c:"launcher", s:"ok", k:["2.0.45","proxySha256","rotk-shotgun-sprint.ini","3D2319E6"], v:"version",
 t:{fr:"Vérifier qu'on a bien le dernier correctif",en:"Check you have the latest patch"},
 f:{fr:["Regarde la version du launcher en haut à droite, à côté du bouton pour réduire : BUILD 2.0.45. C'est elle qui compte.", "Plus ancienne : mets le launcher à jour, puis ferme complètement le jeu et relance-le.", "Pour vérifier que le correctif de jeu est en place : après avoir lancé le jeu, ouvre ton dossier de jeu, clic droit sur rotk-shotgun-sprint.ini > Ouvrir avec > Bloc-notes.", "Si la ligne proxySha256= commence par 3D2319E6, c'est le correctif de jeu de la 2.0.45. Si elle commence par FFE3456B (2.0.44) ou 7DE5B115 (2.0.43), relance le jeu depuis le launcher à jour."],en:["Check the launcher version top right, next to the minimize button: BUILD 2.0.45. That's what counts.", "Older: update the launcher, then fully close the game and launch it again.", "To check the game patch is in place: after launching the game, open your game folder, right-click rotk-shotgun-sprint.ini > Open with > Notepad.", "If the proxySha256= line starts with 3D2319E6, that's the 2.0.45 game patch. If it starts with FFE3456B (2.0.44) or 7DE5B115 (2.0.43), relaunch the game from the updated launcher."]},
 n:{fr:"Pas de rotk-shotgun-sprint.ini ? Ça ne veut pas dire que tu n'es pas à jour : le launcher ne l'écrit que quand le correctif de jeu est activé pour ce lancement, c'est le serveur qui décide. Les correctifs (reboot en trio, sortie de véhicule, visée, tir bloqué en visant en mouvement) ne se chargent qu'après avoir fermé puis relancé le jeu.",en:"No rotk-shotgun-sprint.ini? That doesn't mean you're outdated: the launcher only writes it when the game patch is turned on for that launch, the server decides. Fixes (trio reboot, vehicle exit, aiming, shot locking when aiming while moving) only load after closing and relaunching the game."},
 m:{fr:"regarde la version en haut à droite du launcher, il faut BUILD 2.0.45. pour vérifier le correctif de jeu, ouvre rotk-shotgun-sprint.ini avec le bloc-notes : si proxySha256= commence par 3D2319E6 c'est celui de la 2.0.45 (pas de .ini veut pas forcément dire que t'es pas à jour)",en:"check the version top right in the launcher, u need BUILD 2.0.45. to check the game patch, open rotk-shotgun-sprint.ini with notepad: if proxySha256= starts with 3D2319E6 it's the 2.0.45 one (no .ini doesn't always mean ur outdated)"}},
{c:"launcher", s:"ok", k:["administrateur","administrator rights","ROTK.Diagnostics.exe"], v:"admin",
 t:{fr:"« Les droits administrateur n'ont pas pu être vérifiés »",en:"\"Administrator rights could not be verified\""},
 f:{fr:["Le launcher vérifie tes droits avec son outil ROTK.Diagnostics.exe (dans C:\\Program Files\\ROTK Launcher\\resources\\diagnostics). S'il n'a pas pu le lancer, c'est le plus souvent l'antivirus qui l'a bloqué ou mis en quarantaine.", "Ouvre la quarantaine ou l'historique de ton antivirus (Defender : Sécurité Windows > Protection contre les virus et menaces > Historique de protection) et restaure ROTK.Diagnostics.exe s'il y est.", "Ajoute C:\\Program Files\\ROTK Launcher en exclusion (fiche Windows Defender), puis relance le launcher.", "Le fichier a disparu : relance l'installateur du launcher par-dessus l'installation actuelle.", "En dernier recours seulement : coupe l'antivirus le temps de réinstaller, puis réactive-le tout de suite."],en:["The launcher checks your rights with its ROTK.Diagnostics.exe tool (in C:\\Program Files\\ROTK Launcher\\resources\\diagnostics). If it couldn't run it, most of the time the antivirus blocked or quarantined it.", "Open your antivirus quarantine or history (Defender: Windows Security > Virus & threat protection > Protection history) and restore ROTK.Diagnostics.exe if it's there.", "Add C:\\Program Files\\ROTK Launcher as an exclusion (Windows Defender card), then open the launcher again.", "The file is gone: run the launcher installer again over the current install.", "Last resort only: turn off the antivirus while you reinstall, then turn it back on right away."]},
 n:{fr:"Le message du launcher propose « Exécuter en tant qu'administrateur » (clic droit sur le raccourci ROTK Launcher). Tu peux essayer, mais si l'antivirus a pris ROTK.Diagnostics.exe, ça ne suffit pas.",en:"The launcher's message suggests \"Run as administrator\" (right-click the ROTK Launcher shortcut). You can try it, but if the antivirus took ROTK.Diagnostics.exe, that's not enough."},
 r:["windows-defender"],
 m:{fr:"ton antivirus a sûrement bloqué ROTK.Diagnostics.exe (l'outil du launcher qui vérifie les droits admin). restaure-le depuis sa quarantaine, mets C:\\Program Files\\ROTK Launcher en exclusion, et s'il a disparu réinstalle le launcher par dessus",en:"ur antivirus prob blocked ROTK.Diagnostics.exe (the launcher tool that checks admin rights). restore it from quarantine, add C:\\Program Files\\ROTK Launcher as an exclusion, and if it's gone reinstall the launcher over itself"}},
{c:"launcher", s:"ok", k:["powershell.exe","IDP.HELU.PSE94","AVG","Avast"],
 t:{fr:"AVG ou Avast bloque powershell.exe",en:"AVG or Avast blocks powershell.exe"},
 f:{fr:["Les exclusions de dossier n'y font rien.","Couper le bouclier Comportement (« Agent actions suspectes ») le temps de jouer."],en:["Folder exclusions don't help.","Turn off the Behavior Shield while you play."]},
 m:{fr:"c'est le bouclier comportement d'avg/avast, les exclusions servent à rien pour celui-là, coupe-le le temps de jouer",en:"that's avg/avast's behavior shield, exclusions don't help for that one, turn it off while u play"}},
{c:"launcher", s:"known", k:["Report not sent","HTTP 403","HTTP 503","Rapport non envoyé"],
 t:{fr:"« Report not sent » (HTTP 403 ou 503)",en:"\"Report not sent\" (HTTP 403 or 503)"},
 f:{fr:["C'est le serveur qui refuse le rapport, pas ton PC.", "Laisse Debug coché dans les réglages du launcher et relance le launcher plus tard : il ne réessaie qu'au démarrage, avec le dernier rapport, gardé sur ton PC en attendant."],en:["It's the server refusing the report, not your PC.", "Leave Debug ticked in the launcher settings and restart the launcher later: it only retries at startup, with the latest report, kept on your PC meanwhile."]},
 m:{fr:"c'est leur serveur qui refuse le rapport, rien à voir avec ton pc. laisse debug coché et relance le launcher plus tard, il renvoie le rapport au démarrage",en:"their server is refusing the report, nothing to do with ur pc. keep debug ticked and restart the launcher later, it resends the report at startup"}},

/* COMPTE */
{c:"compte", s:"ok", k:["inscription","niveau Steam","tuto","Steam level"], v:"account",
 t:{fr:"Créer un compte : niveau Steam et tuto",en:"Creating an account: Steam level and tutorial"},
 f:{fr:["Inscriptions ouvertes depuis le 17/10.","Compte Steam niveau 1 minimum (Profil > Badges > Pilier de la communauté). Mettre 5 € ne donne pas le niveau.","Les nouveaux comptes doivent finir le tuto (environ 10 min) avant les parties publiques."],en:["Sign-ups open since 17/10.","Steam level 1 minimum (Profile > Badges > Pillar of the Community). Adding funds doesn't give levels.","New accounts must finish the tutorial (about 10 min) before public matches."]},
 m:{fr:"il te faut un compte steam niveau 1 (profil > badges > pilier de la communauté) puis le tuto d'environ 10 min avant de jouer en public",en:"u need steam level 1 (profile > badges > pillar of the community) then the ~10 min tutorial before public games"}},
{c:"compte", s:"known", k:["Steam level could not be verified","profil public"], v:"steamlevel",
 t:{fr:"« Your Steam level could not be verified »",en:"\"Your Steam level could not be verified\""},
 f:{fr:["Profil Steam en public (Profil > Modifier > Confidentialité > Mon profil : Public).","Vérifier que c'est bien le compte Steam lié à ton compte ROTK et qu'il est niveau 1 ou plus.","Déjà public et niveau OK : souci côté serveur, réessayer plus tard ou ouvrir un ticket avec l'heure."],en:["Steam profile public (Profile > Edit > Privacy > My profile: Public).","Check it's the Steam account linked to your ROTK account and that it's level 1 or more.","Already public and level OK: server-side issue, retry later or open a ticket with the time."]},
 n:{fr:"Ce message s'affiche en anglais même avec le launcher en français, c'est normal.",en:"This message shows in English even with the launcher in French, that's normal."},
 m:{fr:"mets ton profil steam en public et vérifie que t'es niveau 1. si c'est déjà bon, c'est un souci côté serveur, réessaie plus tard",en:"set ur steam profile to public and check u're level 1. if it's already fine, it's server side, retry later"}},
{c:"compte", s:"lead", k:["G9","Gateway Connect","chargement infini"], v:"assets",
 t:{fr:"Erreur G9 ou chargement infini",en:"G9 error or endless loading"},
 f:{fr:["Fermer complètement le jeu et relancer depuis le launcher.","Assets jamais finis : vider asset-cache dans .ROTK-assets et tout retélécharger (a réglé un joueur bloqué 3 jours).","Tester l'autre région et le partage de connexion du téléphone."],en:["Fully close the game and relaunch from the launcher.","Assets never finished: empty asset-cache in .ROTK-assets and redownload everything (fixed a player stuck for 3 days).","Try the other region and your phone hotspot."]},
 n:{fr:"Ne poste jamais en public le lien de la page d'erreur : il contient ton ticket de connexion.",en:"Never post the error page link in public: it contains your login ticket."},
 m:{fr:"ferme complètement le jeu et relance depuis le launcher. si ça continue, vide asset-cache dans .ROTK-assets et laisse tout retélécharger",en:"fully close the game and relaunch from the launcher. if it keeps happening, empty asset-cache in .ROTK-assets and let it redownload"}},
{c:"compte", s:"lead", k:["disconnected","déconnecté"],
 t:{fr:"« You have been disconnected » en partie",en:"\"You have been disconnected\" in a match"},
 f:{fr:["Mettre le launcher à jour (le bug de la veste Faded Bronze est corrigé depuis le 19/10).","Câble plutôt que wifi, redémarrer la box, fermer ce qui télécharge.","Pas de VPN, ExitLag ou Riot Vanguard pendant le test."],en:["Update the launcher (the Faded Bronze jacket bug is fixed since 19/10).","Cable rather than wifi, restart your router, close downloads.","No VPN, ExitLag or Riot Vanguard while testing."]},
 n:{fr:"Si ça continue, ouvre un ticket avec l'heure et le fichier Logs\\H1Z1 PlayClient (Live).log, récupéré avant de relancer le jeu.",en:"If it keeps going, open a ticket with the time and the Logs\\H1Z1 PlayClient (Live).log file, grabbed before relaunching the game."},
 m:{fr:"mets le launcher à jour, passe en câble si tu peux et coupe vpn/exitlag. si ça continue ouvre un ticket avec l'heure",en:"update the launcher, use cable if u can and turn off vpn/exitlag. if it keeps happening open a ticket with the time"}},
{c:"compte", s:"ok", k:["LaLiga","Espagne","Spain","timeout"],
 t:{fr:"Le site ou le launcher ne répond plus (Espagne, soirs de match)",en:"Site or launcher not responding (Spain, match nights)"},
 f:{fr:["Pendant les matchs de LaLiga, des FAI espagnols bloquent des adresses Cloudflare.","Installer Cloudflare WARP (appli 1.1.1.1) ou attendre la fin du match."],en:["During LaLiga matches, Spanish ISPs block some Cloudflare addresses.","Install Cloudflare WARP (1.1.1.1 app) or wait for the match to end."]},
 m:{fr:"si t'es en espagne c'est le blocage pendant les matchs de liga, installe l'appli 1.1.1.1 (warp) ou attends la fin du match",en:"if u're in spain it's the block during liga matches, install the 1.1.1.1 app (warp) or wait for the match to end"}},
{c:"compte", s:"known", k:["ban","banappeals"],
 t:{fr:"Ban ou compte suspendu",en:"Ban or suspended account"},
 f:{fr:["Uniquement par mail : banappeals@rotk.app.", "Mets ton Steam ID (les 17 chiffres dans l'adresse de ton profil Steam) et ton pseudo en jeu.", "Un seul mail suffit, en renvoyer ne va pas plus vite : la réponse arrive par mail."],en:["Email only: banappeals@rotk.app.", "Include your Steam ID (the 17 digits in your Steam profile URL) and your in-game name.", "One email is enough, sending more doesn't speed it up: the answer comes by email."]},
 n:{fr:"Personne sur le Discord ne peut voir ni changer un ban, à part le staff.",en:"Nobody on the Discord can see or change a ban, except the staff."},
 m:{fr:"pour les bans c'est uniquement par mail à banappeals@rotk.app, un seul mail avec ton steam id suffit",en:"bans are by email only at banappeals@rotk.app, one email with ur steam id is enough"}},

/* VOCAL */
{c:"vocal", s:"ok", k:["vocal","voice","horloge","time.is"], v:"clock",
 t:{fr:"Aucun vocal : personne ne t'entend, tu n'entends personne",en:"No voice at all: nobody hears you, you hear nobody"},
 f:{fr:["Va sur time.is : il te dit si l'horloge de ton PC est en avance ou en retard. 2 ou 3 minutes d'écart suffisent à casser le vocal.", "Paramètres Windows > Heure et langue > Date et heure : active « Régler l'heure automatiquement » et « Définir le fuseau horaire automatiquement ».", "Clique sur « Synchroniser maintenant », puis relance complètement le jeu."],en:["Go to time.is: it tells you if your PC clock is ahead or behind. 2 or 3 minutes off is enough to break voice.", "Windows Settings > Time & language > Date & time: turn on \"Set time automatically\" and \"Set time zone automatically\".", "Click \"Sync now\", then fully restart the game."]},
 m:{fr:"regarde l'heure de ton pc sur time.is, même 2-3 min d'écart ça casse le vocal. active heure et fuseau automatiques et synchronise",en:"check ur pc clock on time.is, even 2-3 min off breaks voice. turn on automatic time and time zone and sync"}},
{c:"vocal", s:"ok", k:["proximité","proximity","push to talk","Alt+M"],
 t:{fr:"Le vocal de groupe marche, la proximité jamais",en:"Group voice works, proximity never"},
 f:{fr:["Échap > Audio : vérifier que la proximité est activée.","Push-to-talk de proximité sur un bouton de souris : le mettre sur une touche clavier.","Alt+M coupe la proximité : appuyer une fois."],en:["Esc > Audio: check proximity is enabled.","Proximity push-to-talk on a mouse button: move it to a keyboard key.","Alt+M mutes proximity: press it once."]},
 m:{fr:"vérifie que la proxi est activée dans échap > audio, et si ton push to talk proxi est sur la souris mets-le sur une touche clavier",en:"check proximity is enabled in esc > audio, and if ur proximity push to talk is on a mouse button move it to a keyboard key"}},
{c:"vocal", s:"ok", k:["Vivox","vivoxsdk_x64.dll","legacy Vivox SDK","SDK Vivox historique"], v:"vivox",
 t:{fr:"« Le SDK Vivox historique est introuvable »",en:"\"The legacy Vivox SDK could not be found\""},
 f:{fr:["Ferme complètement le launcher.", "Ouvre ton dossier de jeu (celui où est H1Z1.exe).", "Copie vivoxsdk_x64.original.dll, colle-le dans le même dossier, puis renomme la copie en vivoxsdk_x64.dll.", "Pas de .original.dll ? Prends vivoxsdk_x64.dll dans le dossier Steam du jeu.", "Ajoute ton dossier de jeu aux exclusions de l'antivirus pour que ça ne revienne pas."],en:["Fully close the launcher.", "Open your game folder (the one with H1Z1.exe).", "Copy vivoxsdk_x64.original.dll, paste it in the same folder, then rename the copy to vivoxsdk_x64.dll.", "No .original.dll? Take vivoxsdk_x64.dll from the game's Steam folder.", "Add your game folder to your antivirus exclusions so it doesn't come back."]},
 n:{fr:"Réinstaller le launcher ne règle pas ça. Pour voir les extensions et ne pas créer un vivoxsdk_x64.dll.dll : Explorateur > Affichage > Afficher > Extensions de noms de fichiers.",en:"Reinstalling the launcher doesn't fix this. To see extensions and avoid creating a vivoxsdk_x64.dll.dll: File Explorer > View > Show > File name extensions."},
 m:{fr:"ton antivirus a viré un fichier du jeu. dans ton dossier rotk, copie vivoxsdk_x64.original.dll, renomme la copie en vivoxsdk_x64.dll et relance",en:"ur antivirus removed a game file. in ur rotk folder, copy vivoxsdk_x64.original.dll, rename the copy to vivoxsdk_x64.dll and relaunch"}},

/* PERFS */
{c:"perfs", s:"ok", k:["fps","1000 Hz","polling","souris","8000 Hz","4000 Hz","8k"],
 t:{fr:"Chutes de FPS ou saccades en combat",en:"FPS drops or stutters in fights"},
 f:{fr:["Dans le logiciel de ta souris, mets la fréquence (polling rate) à 1000 Hz maximum, jamais 4000 ou 8000 ; 500 Hz si ton processeur est modeste.", "Limite tes FPS juste sous la fréquence de ton écran (dans le panneau NVIDIA ou AMD).", "Dans les réglages du jeu, mets le Mode d'affichage sur « Plein écran fenêtré ».", "Paramètres Windows > Système > Écran > Graphiques : mets H1Z1.exe de ton dossier ROTK en Performances élevées."],en:["In your mouse software, set the polling rate to 1000 Hz max, never 4000 or 8000; 500 Hz if your CPU is modest.", "Cap your FPS just under your monitor's refresh rate (in the NVIDIA or AMD panel).", "In the game settings, set Display Mode to \"Fullscreen Windowed\" (borderless).", "Windows Settings > System > Display > Graphics: set H1Z1.exe from your ROTK folder to High performance."]},
 n:{fr:"Mesuré le 21/10 sur un gros PC : à 8 000 Hz, le jeu perd environ 17 % de FPS dès que la souris bouge, rien quand elle est immobile (https://github.com/ROTK-Team/rotk-launcher/issues/215). Annonce du 20/10 : le staff sait que certains joueurs ont des pertes de FPS et des freezes en jeu et cherche la cause côté serveur. Si ces réglages ne changent rien, ce n'est pas forcément ton PC.",en:"Measured on 21/10 on a strong PC: at 8,000 Hz the game loses about 17% FPS as soon as the mouse moves, nothing when it's still (https://github.com/ROTK-Team/rotk-launcher/issues/215). 20/10 announcement: staff know some players get FPS drops and freezes in game and are looking for the cause server-side. If these settings change nothing, it's not necessarily your PC."},
 m:{fr:"mets ta souris à 1000 Hz max, bloque tes fps juste sous les Hz de ton écran et passe en plein écran fenêtré",en:"set ur mouse to 1000 Hz max, cap ur fps just under ur monitor's hz and use fullscreen windowed"}},
{c:"perfs", s:"ok", k:["UserOptions.ini","réglages","settings","graphismes","graphics","visibilité","visibility","optimiser","AngA"],
 t:{fr:"Optimiser ses réglages graphiques (UserOptions.ini)",en:"Optimize your graphics settings (UserOptions.ini)"},
 f:{fr:["Ouvre l'outil de réglages d'AngA : https://dl.anga.tv/H1z1/ROTK.html", "Choisis ton UserOptions.ini, dans ton dossier de jeu (par exemple C:\\Games\\ROTK). Il est lu sur ton PC, rien n'est envoyé.", "Choisis ton profil : la puissance de ton PC et ce que tu veux (lisibilité, FPS, réactivité ou qualité).", "Ferme le jeu, garde une copie de ton ancien fichier, puis remplace-le par celui que l'outil te donne. Ta sensibilité, tes touches, l'audio et le FOV sont gardés."],en:["Open AngA's settings tool: https://dl.anga.tv/H1z1/ROTK.html", "Pick your UserOptions.ini, in your game folder (e.g. C:\\Games\\ROTK). It's read on your PC, nothing is sent.", "Pick your profile: how strong your PC is and what you want (visibility, FPS, responsiveness or quality).", "Close the game, keep a copy of your old file, then replace it with the one the tool gives you. Your sensitivity, keys, audio and FOV are kept."]},
 n:{fr:"Pas de UserOptions.ini ? Lance le jeu une fois puis ferme-le, il se crée. Ne le mets pas en lecture seule : le jeu ne lirait plus tes réglages.",en:"No UserOptions.ini? Launch the game once then close it, it gets created. Don't make it read-only: the game would stop reading your settings."},
 m:{fr:"pour tes réglages (fps, visibilité), utilise l'outil d'AngA : https://dl.anga.tv/H1z1/ROTK.html. tu choisis ton UserOptions.ini dans ton dossier de jeu, ton profil, et il te donne le fichier à remplacer (jeu fermé, garde une copie de l'ancien)",en:"for ur settings (fps, visibility), use AngA's tool: https://dl.anga.tv/H1z1/ROTK.html. pick ur UserOptions.ini in ur game folder, ur profile, and it gives u the file to replace (game closed, keep a copy of the old one)"}},
{c:"perfs", s:"ok", k:["30 fps","iGPU","portable","laptop"], v:"gpu",
 t:{fr:"30 fps partout ou le jeu tourne sur la puce graphique intégrée",en:"30 fps everywhere or the game runs on the integrated GPU"},
 f:{fr:["Paramètres > Système > Écran > Graphiques > Parcourir : choisir H1Z1.exe du dossier ROTK (pas ROTK Launcher.exe, pas celui de Steam) > Performances élevées.","Écran branché sur la carte graphique, portable sur secteur."],en:["Settings > System > Display > Graphics > Browse: pick H1Z1.exe from the ROTK folder (not ROTK Launcher.exe, not the Steam one) > High performance.","Monitor plugged into the graphics card, laptop plugged in."]},
 n:{fr:"Pour trouver le bon dossier : jeu lancé, Gestionnaire des tâches, clic droit sur H1Z1 > Ouvrir l'emplacement du fichier.",en:"To find the right folder: with the game running, Task Manager, right-click H1Z1 > Open file location."},
 m:{fr:"dans paramètres > système > écran > graphiques, ajoute le H1Z1.exe de ton dossier rotk (pas le launcher) et mets-le en performances élevées",en:"in settings > display > graphics, add the H1Z1.exe from ur rotk folder (not the launcher) and set it to high performance"}},
{c:"perfs", s:"known", k:["11 s","saccade","stutter"],
 t:{fr:"Petite saccade toutes les 11 secondes, même au menu",en:"Small hitch every 11 seconds, even in the menu"},
 f:{fr:["Connu, ça vient du jeu (issue #180).","Rien à faire côté PC pour l'instant."],en:["Known, it comes from the game (issue #180).","Nothing to do on the PC for now."]},
 m:{fr:"celle-là est connue, elle vient du jeu, pas de ton pc",en:"that one's known, it comes from the game, not ur pc"}},
{c:"perfs", s:"ok", k:["alt+tab","micro-freeze","plein écran"],
 t:{fr:"Micro-freezes après un Alt+Tab en plein écran",en:"Micro-freezes after Alt+Tab in fullscreen"},
 f:{fr:["Le plus simple : relance le jeu après un Alt+Tab, ou évite de tabber en partie.", "Clic droit sur H1Z1.exe (dossier du jeu) > Propriétés > onglet Compatibilité : coche « Désactiver les optimisations du plein écran ».", "Pour garder l'étiré sans plein écran : mets le bureau Windows en 1440x1080 (panneau NVIDIA, mise à l'échelle plein écran par le GPU), puis le jeu en « Plein écran fenêtré »."],en:["Simplest: restart the game after an Alt+Tab, or avoid tabbing mid-match.", "Right-click H1Z1.exe (game folder) > Properties > Compatibility tab: tick \"Disable fullscreen optimizations\".", "To keep stretched without fullscreen: set the Windows desktop to 1440x1080 (NVIDIA panel, fullscreen scaling by the GPU), then the game to \"Fullscreen Windowed\" (borderless)."]},
 m:{fr:"le plein écran exclusif gère mal le retour après un alt+tab. mets ton bureau en 1440x1080 avec mise à l'échelle gpu et le jeu en plein écran fenêtré",en:"exclusive fullscreen handles alt+tab badly. set ur desktop to 1440x1080 with gpu scaling and the game to fullscreen windowed"}},
{c:"perfs", s:"ok", k:["G12","écran noir","black screen"],
 t:{fr:"Écran noir en jeu, erreur G12, pilote graphique qui redémarre",en:"Black screen in game, G12 error, graphics driver reset"},
 f:{fr:["Dans les réglages du jeu, mets le Mode d'affichage sur « Plein écran fenêtré ».", "Débranche pour tester un 2e écran qui tourne à une autre fréquence, ou une carte d'acquisition.", "Réinstalle proprement le pilote graphique (option « installation propre » de NVIDIA ou AMD).", "Vieille alimentation d'entrée de gamme : c'était la cause chez un joueur."],en:["In the game settings, set Display Mode to \"Fullscreen Windowed\" (borderless).", "To test, unplug a 2nd monitor running at another refresh rate, or a capture card.", "Clean-install the graphics driver (NVIDIA or AMD \"clean install\" option).", "Old budget power supply: it was the cause for one player."]},
 m:{fr:"passe en plein écran fenêtré, et si t'as un 2e écran avec une autre fréquence débranche-le pour tester",en:"switch to fullscreen windowed, and if u have a 2nd monitor at a different refresh rate unplug it to test"}},
{c:"perfs", s:"lead", k:["freeze","températures","HWiNFO","PCI Express"],
 t:{fr:"Le PC entier freeze ou s'éteint après un moment",en:"The whole PC freezes or shuts down after a while"},
 f:{fr:["HWiNFO en mode capteurs, regarder la colonne Maximum après le freeze.","Processeur au-dessus de 90 °C : poussière, pâte thermique, ventirad trop faible.","« PCI Express Error Counters » qui monte : remettre la carte graphique bien à fond et vérifier son câble d'alimentation."],en:["HWiNFO in sensors-only mode, check the Maximum column after the freeze.","CPU above 90 °C: dust, thermal paste, cooler too weak.","\"PCI Express Error Counters\" going up: reseat the graphics card and check its power cable."]},
 m:{fr:"lance hwinfo en mode capteurs pendant que tu joues et au prochain freeze regarde la colonne maximum du cpu et de la carte graphique",en:"run hwinfo in sensors mode while u play and at the next freeze check the maximum column for cpu and gpu"}},

/* EN JEU */
{c:"enjeu", s:"ok", k:["tuto","tutorial","Fuel stop","bidon","essence"], v:"fuel",
 t:{fr:"Tuto bloqué à l'étape du carburant",en:"Tutorial stuck at the fuel step"},
 f:{fr:["Monter d'abord DANS la voiture.","Faire le plein en étant dedans, avec le bidon de l'inventaire.","Réservoir plein : rouler un peu avant."],en:["Get IN the car first.","Refuel from inside, using the fuel can in your inventory.","Tank full: drive a bit first."]},
 n:{fr:"La consigne « à pied à côté de la voiture » induit en erreur. Le tuto est dans le menu principal (« Operation Recruit »), pas dans le Combat Training.",en:"The \"on foot beside the car\" instruction is misleading. The tutorial is in the main menu (\"Operation Recruit\"), not in Combat Training."},
 m:{fr:"faut d'abord monter dans la voiture puis faire le plein en étant dedans avec le bidon. à pied à côté ça marche pas",en:"get in the car first, then refuel from inside with the fuel can. it doesn't work on foot next to the car"}},
{c:"enjeu", s:"lead", k:["touche collée","stuck key","avance tout seul"],
 t:{fr:"Le perso continue d'avancer tout seul",en:"Character keeps moving on its own"},
 f:{fr:["Baisser la fréquence de la souris (500 Hz ou moins), surtout avec un processeur modeste : ça l'a réglé chez un joueur.","Débrancher une manette ou un joystick.","Couper le raccourci des touches rémanentes et filtres (Paramètres > Accessibilité > Clavier)."],en:["Lower your mouse polling rate (500 Hz or less), especially with a modest CPU: it fixed it for one player.","Unplug any controller or joystick.","Turn off the Sticky Keys and Filter Keys shortcuts (Settings > Accessibility > Keyboard)."]},
 m:{fr:"baisse la fréquence de ta souris (500 Hz ou moins), ça a réglé ça chez un autre joueur. débranche aussi une manette si t'en as une",en:"lower ur mouse polling rate (500 Hz or less), it fixed it for another player. unplug any controller too"}},
{c:"enjeu", s:"known", k:["bruit de pas","footsteps","son"],
 t:{fr:"On n'entend plus les pas de certains joueurs",en:"Some players' footsteps make no sound"},
 f:{fr:["Signalé par plusieurs joueurs depuis le 17/10, le jour d'une mise à jour serveur sur le son.","Rien à régler côté PC. Un clip avec l'heure et le mode aide à le faire corriger."],en:["Reported by several players since 17/10, the day of a server update about sound.","Nothing to fix on the PC. A clip with the time and mode helps get it fixed."]},
 m:{fr:"plusieurs joueurs l'ont depuis le 17/10, ça a l'air de venir d'une maj serveur. si tu peux, clippe-le et envoie-le dans bug-report",en:"several players have it since 17/10, looks like a server update. if u can, clip it and post it in bug-report"}},
{c:"enjeu", s:"ok", k:["CONNECTING","menu clignote"],
 t:{fr:"CONNECTING ou menu qui clignote au démarrage",en:"CONNECTING or flickering menu at startup"},
 f:{fr:["Normal quelques secondes : le jeu vérifie si ton compte doit faire le tuto.","Bloqué plus d'une minute : fermer complètement le jeu et relancer depuis le launcher à jour."],en:["Normal for a few seconds: the game checks if your account needs the tutorial.","Stuck over a minute: fully close the game and relaunch from the updated launcher."]},
 m:{fr:"c'est normal quelques secondes, ça vérifie ton compte pour le tuto. si ça dure, ferme tout et relance",en:"that's normal for a few sec, it checks ur account for the tutorial. if it lasts, close everything and relaunch"}},
{c:"enjeu", s:"ok", k:["caisse","case","skin"],
 t:{fr:"Caisse ou skin qui n'apparaît pas",en:"Case or skin not showing"},
 f:{fr:["Les caisses s'ouvrent sur rotk.app (inventaire) ou en jeu.", "Ouverte sur le site : ferme complètement le jeu et relance-le pour voir le skin.", "Skin invisible en jeu : dans les réglages du launcher, lance la vérification des fichiers."],en:["Crates open on rotk.app (inventory) or in game.", "Opened on the site: fully close the game and launch it again to see the skin.", "Skin invisible in game: in the launcher settings, run the file check."]},
 m:{fr:"tu peux ouvrir ta caisse sur rotk.app ou en jeu. si c'est sur le site, relance le jeu pour voir le skin",en:"u can open ur case on rotk.app or in game. if it's on the site, relaunch the game to see the skin"}},
{c:"enjeu", s:"ok", k:["caisse","case","crate","animation","roue","wheel","let it roll","ouvrir","ouverture","opening","navigateur","browser","effets d'animation","animation effects"], v:"anim",
 t:{fr:"Pas d'animation quand tu ouvres une caisse",en:"No animation when you open a crate"},
 f:{fr:["Cause : ton navigateur suit l'option « Effets d'animation » de Windows. Si elle est coupée, rotk.app saute la roue « Let it roll » et montre direct ce que tu as gagné.", "Ouvre les Paramètres de Windows (Win + I) > Accessibilité > Effets visuels.", "Active « Effets d'animation ».", "Recharge la page rotk.app (F5), va dans Inventory > Crates, choisis ta caisse et clique sur Open, puis Open one : la roue tourne avant d'afficher ton skin."],en:["Cause: your browser follows the Windows \"Animation effects\" option. When it's off, rotk.app skips the \"Let it roll\" wheel and shows what you got right away.", "Open Windows Settings (Win + I) > Accessibility > Visual effects.", "Turn on \"Animation effects\".", "Reload the rotk.app page (F5), go to Inventory > Crates, pick your crate and click Open, then Open one: the wheel spins before showing your skin."]},
 n:{fr:"Windows 10 : Paramètres > Options d'ergonomie > Affichage > « Afficher les animations dans Windows ». L'animation est juste décorative : elle ne change pas ce que tu gagnes.",en:"Windows 10: Settings > Ease of Access > Display > \"Show animations in Windows\". The animation is just for show: it doesn't change what you get."},
 m:{fr:"c'est windows qui coupe l'animation dans ton navigateur : paramètres (win + i) > accessibilité > effets visuels, active « effets d'animation ». ensuite recharge rotk.app (F5) et réouvre une caisse, la roue tournera",en:"it's windows turning off the animation in ur browser: settings (win + i) > accessibility > visual effects, turn on \"animation effects\". then reload rotk.app (F5) and open a crate again, the wheel will spin"}},
{c:"enjeu", s:"lead", k:["skin","nouveau skin","new skin","cosmétique","cosmetic","nautilus","invisible"],
 t:{fr:"Un skin tout juste sorti ne s'affiche pas en jeu",en:"A brand-new skin doesn't show in game"},
 f:{fr:["Les nouveaux skins arrivent avec une mise à jour des assets : laisse le launcher finir de la télécharger.", "Ferme complètement le jeu, puis relance-le depuis le launcher.", "Toujours l'apparence de base ? Dis-le dans le salon d'aide du Discord avec le nom du skin : ça peut venir du serveur, pas de ton PC."],en:["New skins come with an asset update: let the launcher finish downloading it.", "Fully close the game, then launch it again from the launcher.", "Still the default look? Say it in the help channel of the Discord with the skin's name: it can be server-side, not your PC."]},
 n:{fr:"Exemple : le skin Nautilus du fusil anti-émeute (riot shotgun) est arrivé avec les assets 1.13.51, le 21/10 (1,6 Go à télécharger).",en:"Example: the Nautilus riot shotgun skin came with assets 1.13.51 on 21/10 (a 1.6 GB download)."},
 m:{fr:"les nouveaux skins arrivent avec la maj des assets : laisse le launcher la finir, puis ferme et relance le jeu. si tu vois toujours l'apparence de base, dis-le dans le salon d'aide avec le nom du skin",en:"new skins come with the asset update: let the launcher finish it, then close and relaunch the game. if u still see the default look, say it in the help channel with the skin name"}},
{c:"enjeu", s:"ok", k:["langue","language","français","anglais","chinois","English","French","Chinese","Social"],
 t:{fr:"Changer la langue du jeu (français, anglais, chinois)",en:"Change the game language (French, English, Chinese)"},
 f:{fr:["Depuis le launcher 2.0.44, le jeu prend la langue du launcher : launcher en français = jeu en français, Social compris. Pareil en anglais et en chinois.","Pour changer : clique sur le drapeau en haut à droite du launcher, juste à gauche de BUILD, et choisis ta langue.","Ferme complètement le jeu puis relance-le depuis le launcher : la langue change au lancement suivant."],en:["Since launcher 2.0.44, the game uses the launcher's language: launcher in French = game in French, Social included. Same for English and Chinese.","To change it: click the flag top right in the launcher, just left of BUILD, and pick your language.","Fully close the game, then launch it again from the launcher: the language changes at the next launch."]},
 n:{fr:"Pas d'autres langues, et pas de jeu en anglais avec un launcher en français : le launcher donne sa langue au jeu à chaque lancement.",en:"No other languages, and no English game with a French launcher: the launcher gives the game its language at every launch."},
 m:{fr:"depuis la 2.0.44 le jeu suit la langue du launcher. change-la avec le drapeau en haut à droite du launcher (à côté de BUILD), puis ferme et relance le jeu",en:"since 2.0.44 the game follows the launcher language. change it with the flag top right in the launcher (next to BUILD), then close and relaunch the game"}},
{c:"enjeu", s:"ok", k:["reboot","trio","spectateur","spectator","réintégration","réintégrer"], v:"version",
 t:{fr:"Reboot en trio : tu restes spectateur, invisible",en:"Trio reboot: you stay spectating, invisible"},
 f:{fr:["Mettre le launcher à jour (2.0.42 ou plus récent, correctif sorti le 18/10) et relancer le jeu.","Si le log rotk-shotgun-sprint.log affiche « bridge allocation refused » : mettre à jour le pilote graphique et Windows."],en:["Update the launcher (2.0.42 or newer, fix released 18/10) and relaunch the game.","If rotk-shotgun-sprint.log shows \"bridge allocation refused\": update the graphics driver and Windows."]},
 n:{fr:"En jeu, le reboot s'appelle maintenant « Réintégration » en français (« RÉINTÉGRATION » sur la carte) et « 召回 » en chinois.",en:"In game, reboot is now called \"Réintégration\" in French (\"RÉINTÉGRATION\" on the map) and \"召回\" in Chinese."},
 m:{fr:"mets le launcher à jour et relance le jeu, c'est corrigé depuis le 18/10. si ça continue, mets à jour ton pilote graphique",en:"update the launcher and relaunch the game, it's fixed since 18/10. if it continues, update ur graphics driver"}},

/* ANTIVIRUS */
{c:"antivirus", s:"ok", k:["Defender","exclusion"], v:"defender",
 t:{fr:"Windows Defender",en:"Windows Defender"},
 f:{fr:["Ouvre Sécurité Windows > Protection contre les virus et menaces > Gérer les paramètres.", "Descends jusqu'à Exclusions > Ajouter ou supprimer des exclusions > Ajouter une exclusion > Dossier.", "Ajoute ton dossier de jeu (ex. C:\\Games\\ROTK), puis C:\\Program Files\\ROTK Launcher.", "Un fichier a disparu ? Historique de protection > clique sur l'élément > Actions > Restaurer."],en:["Open Windows Security > Virus & threat protection > Manage settings.", "Scroll to Exclusions > Add or remove exclusions > Add an exclusion > Folder.", "Add your game folder (e.g. C:\\Games\\ROTK), then C:\\Program Files\\ROTK Launcher.", "A file is gone? Protection history > click the item > Actions > Restore."]},
 m:{fr:"ajoute ton dossier de jeu et C:\\Program Files\\ROTK Launcher en exclusion dans sécurité windows, et restaure le fichier dans l'historique de protection s'il a disparu",en:"add ur game folder and C:\\Program Files\\ROTK Launcher as exclusions in windows security, and restore the file from protection history if it's gone"}},
{c:"antivirus", s:"ok", k:["accès contrôlé","ransomware","controlled folder","EPERM","Accès refusé","Access denied"], v:"cfa",
 t:{fr:"Accès contrôlé aux dossiers bloque le jeu (« Accès refusé », EPERM)",en:"Controlled folder access blocks the game (\"Access denied\", EPERM)"},
 f:{fr:["Ouvre Sécurité Windows (touche Windows, tape « Sécurité Windows »).","Va dans Protection contre les virus et menaces, puis tout en bas : Gérer la protection contre les ransomwares.","Si « Accès contrôlé aux dossiers » est Activé : clique sur Autoriser une application via l'accès contrôlé aux dossiers.","Ajouter une application autorisée > Parcourir toutes les applications : choisis H1Z1.exe dans ton dossier de jeu ROTK (ex. C:\\Games\\ROTK\\H1Z1.exe).","Recommence pour C:\\Program Files\\ROTK Launcher\\ROTK Launcher.exe, puis relance le launcher."],en:["Open Windows Security (Windows key, type \"Windows Security\").","Go to Virus & threat protection, then at the very bottom: Manage ransomware protection.","If \"Controlled folder access\" is On: click Allow an app through Controlled folder access.","Add an allowed app > Browse all apps: pick H1Z1.exe in your ROTK game folder (e.g. C:\\Games\\ROTK\\H1Z1.exe).","Do it again for C:\\Program Files\\ROTK Launcher\\ROTK Launcher.exe, then relaunch the launcher."]},
 n:{fr:"Si « Accès contrôlé aux dossiers » est déjà Désactivé, ce n'est pas lui : regarde ton antivirus (fiches Defender, Norton, Avast). Si le message dit « Accès refusé au fichier G:\\ (EPERM, mkdir) » (juste une lettre de disque), c'est ton dossier d'installation : refais l'installation du client dans un dossier comme G:\\Games (fiche « Installation du client »).",en:"If \"Controlled folder access\" is already Off, it's not this: check your antivirus (Defender, Norton, Avast cards). If the message says \"Access denied to G:\\ (EPERM, mkdir)\" (just a drive letter), it's your install folder: redo the client setup into a folder like G:\\Games (\"Client setup\" card)."},
 r:["windows-defender","norton","avg-ou-avast-bloque-powershell-exe","installation-du-client-quel-dossier-choisir"],
 m:{fr:"dans protection contre les ransomwares > autoriser une application, ajoute ton H1Z1.exe et ROTK Launcher.exe",en:"in ransomware protection > allow an app, add ur H1Z1.exe and ROTK Launcher.exe"}},

// message collé (4 mots ou plus) : seulement les fiches qui ont au moins la moitié du score de la meilleure, au lieu de toutes celles qui ont un mot en commun
function keepBest(ok, groups){
  if (groups.length < 4 || !ok.length) return ok;
  const best = Math.max(...ok.map(o => o.score));
  return ok.filter(o => o.score >= best / 2);

const earlyCrash = groups => { const a = groups.flatMap(g => g.cjk ? [] : [g.own, ...g.alts]); return a.some(w => /^(0x)?c0000005$/.test(w)) && !a.some(w => w.includes("2a31abc")); };
/* La recherche des fiches, pour la barre, la fenêtre de recherche et Réponses rapides : les fiches qui ont tous les mots, sinon celles qui en ont au moins un (strict false),
   puis keepBest, triées par score. sure : la première peut s'ouvrir seule. Jamais avec un mot deviné (guess). Moins de 4 mots : oui. Un message collé : la première fiche
   doit avoir au moins 40 % des mots, dont au moins 2 dans son titre ou ses mots-clés hors rotk et launcher, que presque tous les messages du launcher contiennent
   (« La clé launcher ROTK a été refusée » n'ouvre plus la fiche du dossier du launcher). En chinois, 5 caractères font déjà 4 paires : seulement les 40 %. */
const GENERIC = new Set(["rotk", "launcher", "jeu", "game"]);

  if (!ok.length) { strict = false; ok = res.filter(o => o.matched > 0); }
  const list = keepBest(ok, groups).sort((a, b) => b.score - a.score);
  return {list, strict, sure: !!list[0] && !groups.guess && (groups.length < 4 || list[0].matched / groups.length >= .4 && (groups.some(g => g.cjk) || strongWords(list[0].r._idx, groups) >= 2))};

trol) even when it reads it with the letter O instead of 0."}, {"t": "fix", "fr": "Petits détails : la fenêtre de recherche affiche « Esc » en anglais et en chinois, le dossier « ROTK » de « Où est ton jeu ? » s'affiche plus net, et un chemin en fin de phrase ne garde plus le point dans son cadre.", "en": "Small fixes: the search window shows \"Esc\" in English and Chinese, the \"ROTK\" folder in \"Where is your game?\" looks sharper, and a path at the end of a sentence no longer keeps the period inside its box."}]}, {"v": "2.1", "d": "21/10/2026", "i": [{"t": "add", "fr": "Les 22 vidéos tuto existent maintenant en chinois, avec le launcher et Windows en chinois.", "en": "All 22 tutorial videos now exist in Chinese, with the launcher and Windows in Chinese."}, {"t": "change", "c": "les-droits-administrateur-n-ont-pas-pu-etre-verifies", "fr": "Vidéo « Les droits administrateur n'ont pas pu être vérifiés » refaite : on restaure d'abord ROTK.Diagnostics.exe depuis la quarantaine, couper l'antivirus vient en dernier recours.", "en": "\"Administrator rights could not be verified\" video redone: first restore ROTK.Diagnostics.exe from quarantine, turning the antivirus off comes as a last resort."}, {"t": "change", "fr": "Choix de la langue plus lisible : drapeaux sur fond noir, langue active soulignée en rouge, drapeau chinois ajouté.", "en": "Clearer language switch: flags on a black background, active language underlined in red, Chinese flag added."}]}, {"v": "2.0", "d": "21/10/2026", "i": [{"t": "add", "fr": "Version chinoise (简体中文) : bouton 中文 en haut à droite, ou ?lang=zh. Elle s'ouvre toute seule si ton navigateur est en chinois.", "en": "Chinese version (简体中文): 中文 button top right, or ?lang=zh. It opens by itself if your browser is in Chinese."}, {"t": "add", "fr": "Recherche en chinois : tape un mot ou une phrase en chinois, le wiki trouve les fiches qui en parlent.", "en": "Search in Chinese: type a word or a sentence in Chinese, the wiki finds the cards about it const NOTES_KEY = "h1wiki-notes-seen";
function notesUnseen(){ if (!PATCH_NOTES) return false; try { return localStorage.getItem(NOTES_KEY) !== PATCH_NOTES[0].v; } catch (e) { return false; } }
function notesRender(){
  const T = UI[lang], box = document.getElementById("notesList"); box.innerHTML = "";
  PATCH_NOTES.forEach((n, i) => {
    const sec = el("section", "nt-ver");
    sec.innerHTML = '<div class="nt-head"><span class="nt-v">v' + esc(n.v) + '</span>' + (i === 0 ? '<span class="nt-new">' + esc(T.notesLatest) + '</span>' : '') + '<time>' + esc(dateL(n.d)) + '</time></div>';
    const ul = el("ul");
    n.i.forEach(it => { const li = el("li", "nt-it"); li.innerHTML = '<span class="nt-tag nt-' + it.t + '">' + esc(T.notesTypes[it.t]) + '</span><span>' + esc(it[lang]) + '</span>'; if (it.c) noteLink(li.lastChild, it.c); ul.append(li); });
    sec.append(ul); box.append(sec);
  });
  document.querySelectorAll(".notes-btn").forEach(b => b.classList.toggle("unseen", notesUnseen()));
}
let notesReturn = null;
function notesShow(){
  const d = document.getElementById("notes"); if (!d.hidden) return;
  notesReturn = document.activeElement; notesRender();
  d.hidden = false; document.documentElement.classList.add("pal-open");
  requestAnimationFrame(() => { d.classList.add("in"); document.getElementById("notesClose").focus(); });
  try { localStorage.setItem(NOTES_KEY, PATCH_NOTES[0].v); } catch (e) {}
  document.querySelectorAll(".notes-btn").forEach(b => b.classList.remove("unseen"));
}
function notesHide(){
  const d = document.getElementById("notes"); if (d.hidden) return;
  d.classList.remove("in"); document.documentElement.classList.remove("pal-open");
  setTimeout(() => { d.hidden = true; }, 220);
  if (location.hash === "#patch-notes") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
  if (notesReturn && notesReturn.focus) notesReturn.focus();
}
document.querySelectorAll(".notes-btn").forEach(b => b.addEventListener("click", e => { e.preventDefault(); notesShow(); }));
document.getElementById("notesClose").addEventListener("click", notesHide);
document.getElementById("notesBack").addEventListener("click", notesHide);
document.getElementById("notes").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.preventDefault(); notesHide(); }
  if (e.key === "Tab") { const f = [...document.querySelectorAll("#notes button, #notes a[href], #notes [tabindex='0']")]; const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); } }
});
if (location.hash === "#patch-notes") whenReady(() => setTimeout(notesShow, 80));
document.querySelectorAll(".notes-btn").forEach(b => b.classList.toggle("unseen", notesUnseen()));
whenReady(() => {
  const nav = document.querySelector(".topnav");
  const links = [...nav.querySelectorAll(".tn-links a")];
  const tgt = a => document.getElementById(a.hash.slice(1));
  // les liens vers une fiche passent devant la section qui la contient
  const pick = () => {
    const mid = innerHeight * .45;
    let best = null;
    for (const a of links) {
      const el = tgt(a); if (!el || el.hidden) continue;
      const r = el.getBoundingClientRect();
      if (r.top <= mid && r.bottom >= mid) { if (!best || el.classList.contains("row")) best = a; }
    }
    links.forEach(a => a === best ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current"));
    if (best) { const ul = best.closest(".tn-links"), l = best.offsetLeft, r = l + best.offsetWidth; if (l < ul.scrollLeft) ul.scrollLeft = l - 12; else if (r > ul.scrollLeft + ul.clientWidth) ul.scrollLeft = r - ul.clientWidth + 12; }
  };
  const io = new IntersectionObserver(pick, {threshold: [0, .25, .5, .75, 1]});
  links.forEach(a => { const el = tgt(a); if (el) io.observe(el); });
  // un clic ouvre toujours la cible, même si l'adresse ne change pas
  links.forEach(a => a.addEventListener("click", e => {
    const el = tgt(a);
    if (el && el.classList.contains("row")) { e.preventDefault(); visitCard(el.id); setTimeout(pick, 700); }
  }));
  const slot = document.getElementById("tnSlot");
  new IntersectionObserver(([e]) => nav.classList.toggle("stuck", !e.isIntersecting && e.boundingClientRect.top < 0), {threshold: 0, rootMargin: "-10px 0px 0px 0px"}).observe(slot);
});
matchMedia("(max-width:480px)").addEventListener("change", () => { const T = UI[lang]; document.getElementById("q").placeholder = matchMedia("(max-width:480px)").matches ? T.phShort : T.placeholder; });
</script>
