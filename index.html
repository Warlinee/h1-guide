<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Wiki communautaire NON OFFICIEL : solutions aux problèmes courants du launcher et du jeu H1Z1 (ROTK). Unofficial community wiki.">
<title>Wiki H1 non officiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout : ruban "non officiel" en haut, hero avec la diagonale rouge du launcher, barre de catégories, fiches à angles nets. Reprend la charte du launcher (noirs #060606/#0d0d0d, rouge signal #e10600, police large type Eurostile, Inter) sans logo ni visuel officiel. */
:root{
  --ink:#060606; --panel:#0d0d0d; --panel-2:#161616; --hair:rgba(255,255,255,.1); --hair-2:rgba(255,255,255,.14);
  --text:#ffffff; --dim:#d9d9d9; --muted:#929292; --red:#e10600; --red-dark:#880000; --red-soft:rgba(225,6,0,.16);
  --tape:#f2c230; --tape-ink:#141005; --ok:#9fd84a; --ok-bg:rgba(159,216,74,.12);
  --lead:#7fb2ff; --lead-bg:rgba(127,178,255,.12); --known:#f0a03a; --known-bg:rgba(240,160,58,.12);
  --f-display:"Michroma","Eurostile","Arial",sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
body{overflow-x:clip}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--tape);outline-offset:3px}

/* ruban non officiel */
.tape{position:relative;z-index:2;overflow:hidden;background:repeating-linear-gradient(-45deg,var(--tape) 0 22px,var(--tape-ink) 22px 44px);padding-block:4px}
.tape-inner{background:var(--tape);color:var(--tape-ink);font-family:var(--f-display);font-size:12px;letter-spacing:.12em;white-space:nowrap;display:flex;gap:2.5rem;padding-block:7px;animation:roll 38s linear infinite;width:max-content}
.tape-inner span{display:inline-flex;align-items:center;gap:.7rem}
.tape-inner span::before{content:"";width:7px;height:7px;background:var(--tape-ink);transform:rotate(45deg)}
@keyframes roll{to{transform:translateX(-50%)}}

.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:20px;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:14px}
.brand > div > span{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.brand-mark{width:36px;height:36px;background:var(--red);display:grid;place-items:center;clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)}
.brand-mark svg{width:18px;height:18px;color:#fff}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
.lang{display:flex;gap:2px;border:1px solid var(--hair-2);padding:3px}
.lang button{border:0;background:transparent;padding:6px 9px;cursor:pointer;display:grid;place-items:center;opacity:.4;filter:grayscale(.7);transition:background .5s var(--ease),opacity .5s var(--ease),filter .5s var(--ease)}
.lang button svg{width:28px;height:18px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.lang button:hover{opacity:.8}
.lang button[aria-pressed="true"]{background:var(--panel-2);opacity:1;filter:none;box-shadow:inset 0 -2px 0 var(--red)}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);padding-block:clamp(36px,7vw,84px) clamp(32px,5vw,64px);align-items:end;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;top:-10%;right:-8%;width:46%;height:120%;background:linear-gradient(115deg,transparent 0 38%,var(--red-dark) 38% 41%,transparent 41% 46%,rgba(225,6,0,.55) 46% 52%,transparent 52%);opacity:.55;pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:22px}
.eyebrow::after{content:"";width:46px;height:2px;background:var(--red)}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,5.6vw,70px);line-height:1.05;letter-spacing:.01em;margin:0 0 20px;text-transform:uppercase;text-wrap:balance}
.hero h1 .stroke{color:var(--red)}
.hero p.lede{max-width:54ch;color:var(--dim);font-size:17px;margin:0 0 26px}
.warn{display:flex;gap:14px;align-items:flex-start;background:rgba(242,194,48,.07);padding:16px 18px;border:1px solid rgba(242,194,48,.45);max-width:60ch}
.warn svg{flex:none;width:22px;height:22px;margin-top:2px;color:var(--tape)}
.warn b{color:var(--tape)}
.warn p{margin:0;font-size:14.5px;color:var(--dim)}

.search-shell{background:var(--panel);border:1px solid var(--hair-2);position:relative}
.search-shell::before{content:"";position:absolute;left:-1px;top:-1px;width:64px;height:3px;background:var(--red)}
.search-core{padding:22px}
.search-core label{display:block;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.search-box{display:flex;align-items:center;gap:10px;background:var(--ink);padding:6px 6px 6px 14px;border:1px solid var(--hair-2);transition:border-color .5s var(--ease)}
.search-box:focus-within{border-color:var(--red)}
.search-box svg{width:18px;height:18px;color:var(--muted);flex:none}
.search-box input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font:inherit;font-size:16px;padding:10px 0}
.search-box input:focus{outline:none}
.count{font-size:12.5px;font-weight:700;color:#fff;background:var(--red);padding:8px 12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.quick{margin-top:18px}
.quick p{margin:0 0 9px;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{font:inherit;font-size:13px;font-weight:600;color:var(--dim);background:var(--panel-2);border:1px solid var(--hair);padding:7px 12px;cursor:pointer;transition:background .5s var(--ease),color .5s var(--ease),border-color .5s var(--ease)}
.chip-btn:hover{background:var(--red-soft);border-color:var(--red);color:#fff}
.chip-btn:active{transform:scale(.97)}

/* catégories */
.catbar{position:sticky;top:0;z-index:3;margin-block:8px 32px;background:rgba(6,6,6,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-block:1px solid var(--hair)}
.catbar nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.catbar nav::-webkit-scrollbar{display:none}
.catbar a{flex:none;text-decoration:none;font-weight:600;font-size:13.5px;color:var(--muted);padding:13px 16px;display:flex;gap:8px;align-items:center;box-shadow:inset 0 -2px 0 transparent;transition:color .5s var(--ease),box-shadow .5s var(--ease)}
.catbar a:hover{color:#fff;box-shadow:inset 0 -2px 0 var(--red)}
.catbar a span{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--dim);background:var(--panel-2);padding:1px 7px}

/* sections */
main{display:grid;gap:clamp(48px,7vw,88px);padding-bottom:40px}
.cat{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start;scroll-margin-top:70px}
.cat-head{position:sticky;top:76px;border-top:2px solid var(--red);padding-top:16px}
.cat-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,2.4vw,26px);line-height:1.2;text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;text-wrap:balance}
.cat-head p{margin:0;color:var(--muted);font-size:15px;max-width:34ch}
.list{display:grid;gap:8px;min-width:0}

.card{background:var(--panel);border:1px solid var(--hair);transition:border-color .5s var(--ease)}
.card:hover{border-color:var(--hair-2)}
.card:has(details[open]){border-color:rgba(225,6,0,.55)}
.card summary{list-style:none;cursor:pointer;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.card summary::-webkit-details-marker{display:none}
.card summary h3{margin:0;font-size:16.5px;line-height:1.4;font-weight:600;text-wrap:balance}
.toggle{width:34px;height:34px;background:var(--panel-2);display:grid;place-items:center;grid-row:span 2;transition:transform .6s var(--ease),background .5s var(--ease)}
.toggle svg{width:14px;height:14px}
details[open] .toggle{transform:rotate(45deg);background:var(--red)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;white-space:nowrap;letter-spacing:.02em}
.s-ok{background:var(--ok-bg);color:var(--ok)}
.s-lead{background:var(--lead-bg);color:var(--lead)}
.s-known{background:var(--known-bg);color:var(--known)}
.code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:12px;color:var(--muted);background:var(--ink);padding:2px 8px;overflow-wrap:anywhere}
.body{padding:4px 20px 20px;display:grid;gap:14px;border-top:1px solid var(--hair);margin:0 20px;padding-inline:0;padding-top:16px}
details[open] .body{animation:open .55s var(--ease)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.body h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.body ol,.body ul{margin:8px 0 0;padding-left:22px;display:grid;gap:7px;color:var(--dim)}
.body li::marker{color:var(--red);font-weight:700}
.note{font-size:14.5px;color:var(--muted);border-left:2px solid var(--red);padding-left:12px;margin:0}
code.p{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.86em;background:var(--ink);color:#ffb3ad;padding:1px 6px;overflow-wrap:anywhere}

/* règles + liens */
.panel-shell{background:var(--panel);border:1px solid var(--hair)}
.panel-core{padding:clamp(18px,3vw,28px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:22px 32px}
.panel-core h3{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.panel-core ul{margin:0;padding-left:20px;display:grid;gap:7px;font-size:15px;color:var(--dim)}
.panel-core li::marker{color:var(--red)}
.links{display:grid;gap:0}
.links div{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:14px;padding-block:12px;border-bottom:1px solid var(--hair)}
.links div:last-child{border-bottom:0}
.links b{font-size:14.5px;font-weight:600}
.links a{color:#ff8a83;font-weight:600;overflow-wrap:anywhere}
.links span{overflow-wrap:anywhere;font-size:14.5px;color:var(--dim)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--hair)}

footer{position:relative;z-index:1;margin-top:40px;border-top:2px solid var(--red)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-block:26px 48px;color:var(--muted);font-size:14px}
.foot b{color:var(--tape)}

/* entrée */
.rise{animation:rise .9s var(--ease) both}
.rise.d2{animation-delay:.08s}.rise.d3{animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero::before{width:70%;opacity:.35}
  .cat{grid-template-columns:minmax(0,1fr);gap:16px}
  .cat-head{position:static}
  .links div{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

];

let lang = "fr";
try { const saved = localStorage.getItem("h1wiki-lang"); if (saved === "fr" || saved === "en") lang = saved; else if (!/^fr/i.test(navigator.language || "")) lang = "en"; } catch (e) { if (!/^fr/i.test(navigator.language || "")) lang = "en"; }

const STATUS_CLASS = {ok:"s-ok", lead:"s-lead", known:"s-known"};
const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>';
const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg>';
const QUICK = ["0xC0000005","0xC0E90002","Vivox","JSON","G9","exitCode=18","Steam level","tuto","0%"];

function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function codeify(s){
  return esc(s).replace(/((?:[A-Z]:\\Program Files\\ROTK Launcher|%APPDATA%\\ROTK Launcher)[^\s,)]*|[A-Z]:\\[^\s,)]+|%APPDATA%[^\s,)]*|\b[\w.-]+\.(?:exe|dll|xml|log|json|ini)(?:\.old)?\b|\.ROTK-assets|0x[0-9A-Fa-f]{5,}|--no-sandbox)/g, '<code class="p">$1</code>');
}

function render(){
  const T = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(n => { const v = T[n.dataset.i]; if (v != null) n.innerHTML = v; });
  document.getElementById("tape").innerHTML = Array(8).fill('<span>' + T.tape + '</span>').join("");
  document.getElementById("q").placeholder = T.placeholder;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  const chips = document.getElementById("chips"); chips.innerHTML = "";
  QUICK.forEach(qv => { const b = el("button","chip-btn", esc(qv)); b.type = "button"; b.onclick = () => { const q = document.getElementById("q"); q.value = qv; filter(); q.focus(); }; chips.append(b); });

  const rules = document.getElementById("rules"); rules.innerHTML = "";
  RULES[lang].forEach(([h, items]) => { const d = el("div"); d.append(el("h3", null, esc(h))); const ul = el("ul"); items.forEach(i => ul.append(el("li", null, codeify(i)))); d.append(ul); rules.append(d); });

  const links = document.getElementById("links"); links.innerHTML = "";
  LINKS.forEach(([lab, v]) => { const d = el("div"); d.append(el("b", null, esc(lab[lang]))); if (v.a) { const a = el("a", null, esc(v.a.replace(/^https:\/\//,""))); a.href = v.a; a.target = "_blank"; a.rel = "noopener"; d.append(a); } else d.append(el("span", null, codeify(v.t[lang]))); links.append(d); });

  const holder = document.getElementById("cats"); holder.innerHTML = "";
  const nav = document.getElementById("catnav"); nav.innerHTML = "";
  const navLink = (id, label, n) => { const a = el("a", null, esc(label) + (n != null ? '<span>' + n + '</span>' : "")); a.href = "#" + id; nav.append(a); return a; };
  navLink("avant", T.beforeH);
  CATS.forEach(cat => {
    const items = F.filter(x => x.c === cat.id);
    const sec = el("section","cat"); sec.id = cat.id;
    const head = el("div","cat-head"); head.append(el("h2", null, esc(cat.t[lang]))); head.append(el("p", null, esc(cat.i[lang]))); sec.append(head);
    const list = el("div","list");
    items.forEach(x => list.append(card(x, T)));
    sec.append(list); holder.append(sec);
    cat.sec = sec; cat.badge = navLink(cat.id, cat.t[lang], items.length).querySelector("span");
  });
  navLink("liens", T.linksH);
  filter();
}

function card(x, T){
  const shell = el("article","card");
  shell.dataset.search = [x.t.fr, x.t.en, ...x.k, ...x.f.fr, ...x.f.en, x.n ? x.n.fr + " " + x.n.en : ""].join(" ").toLowerCase();
  const d = el("details");
  const sum = el("summary");
  sum.append(el("h3", null, esc(x.t[lang])));
  const tg = el("span","toggle", ICON_PLUS); tg.setAttribute("aria-hidden","true"); sum.append(tg);
  const meta = el("div","meta");
  meta.append(el("span","pill " + STATUS_CLASS[x.s], esc(T.st[x.s])));
  x.k.slice(0,3).forEach(k => meta.append(el("span","code", esc(k))));
  sum.append(meta); d.append(sum);
  const body = el("div","body");
  const steps = x.f[lang];
  const sec = el("div"); sec.append(el("h4", null, esc(steps.length > 1 ? T.fix : T.fix1)));
  const ol = el(steps.length > 1 ? "ol" : "ul"); steps.forEach(s => ol.append(el("li", null, codeify(s)))); sec.append(ol); body.append(sec);
  if (x.n) body.append(el("p","note", codeify(x.n[lang])));
  d.append(body); shell.append(d);
  return shell;
}

function filter(){
  const T = UI[lang];
  const words = document.getElementById("q").value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  let total = 0;
  CATS.forEach(cat => {
    let shown = 0;
    cat.sec.querySelectorAll(".card").forEach(c => { const ok = words.every(w => c.dataset.search.includes(w)); c.hidden = !ok; if (ok) shown++; if (ok && words.length) c.querySelector("details").open = shown <= 2; });
    cat.sec.hidden = shown === 0; cat.badge.textContent = shown; total += shown;
  });
  document.getElementById("count").textContent = total + " " + (total > 1 ? T.many : T.one);
  document.getElementById("empty").hidden = total !== 0;
}

document.getElementById("q").addEventListener("input", filter);
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("h1wiki-lang", lang); } catch (e) {}
  const q = document.getElementById("q").value; render(); document.getElementById("q").value = q; filter();
}));
render();
</script>
