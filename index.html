/* Layout : centre d'aide sombre. Bannière encadrée avec traînées de lumière rouge (clin d'œil à la diagonale du launcher), accès rapide en grille de cartes, puis liste de problèmes dépliables avec onglets et tags. Noir + rouge signal de ROTK, aucun logo officiel. */
:root{
  --bg:#070708; --s1:#0e0e10; --s2:#141417; --s3:#1b1b1f;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12); --line-3:rgba(255,255,255,.2);
  --text:#f3f3f5; --dim:#c4c4cb; --muted:#8a8a94;
  --red:#e10600; --red-hi:#ff3b2f; --red-soft:rgba(225,6,0,.13); --red-line:rgba(255,59,47,.35);
  --amber:#f2b838; --amber-soft:rgba(242,184,56,.1);
  --ok:#7fd99a; --lead:#8fb6ff; --known:#f2b05c;
  --f-display:"Archivo","Arial",sans-serif; --f:"Geist","Segoe UI",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.22,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--red);color:#fff;font-weight:600;padding:10px 16px;border-radius:10px;text-decoration:none}
.skip:focus{top:12px}
main:focus{outline:none}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* bandeau non officiel */
.notice{border-bottom:1px solid rgba(242,184,56,.22);background:linear-gradient(90deg,rgba(242,184,56,.09),rgba(242,184,56,.04));color:#f5d891;font-size:13.5px}
.notice .wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding-block:9px;text-align:center}
.notice svg{width:16px;height:16px;flex:none;color:var(--amber)}
.notice b{color:var(--amber);font-weight:600}

/* bannière */
.hero{margin:14px max(14px,env(safe-area-inset-left,0px)) 0;border-radius:28px;position:relative;overflow:hidden;isolation:isolate;background:#0b0809;box-shadow:inset 0 0 0 1px var(--line-2)}
.art{position:absolute;inset:0;z-index:-1;pointer-events:none}
.art::before{content:"";position:absolute;inset:0;background:
  radial-gradient(42rem 22rem at 78% 8%,rgba(225,6,0,.38),transparent 62%),
  radial-gradient(30rem 18rem at 12% 110%,rgba(225,6,0,.22),transparent 60%),
  radial-gradient(24rem 14rem at 50% 50%,rgba(255,80,40,.06),transparent 70%)}
.streak{position:absolute;left:-20%;width:150%;transform-origin:center;border-radius:999px}
.streak.a{top:8%;height:130px;transform:rotate(-24deg);background:linear-gradient(90deg,transparent 0,rgba(225,6,0,.0) 20%,rgba(225,6,0,.55) 52%,rgba(255,96,64,.22) 70%,transparent 90%);filter:blur(26px)}
.streak.b{top:34%;height:4px;transform:rotate(-24deg);background:linear-gradient(90deg,transparent 10%,rgba(255,120,90,.9) 55%,transparent 85%);filter:blur(1.5px);opacity:.75}
.streak.c{top:52%;height:70px;transform:rotate(-24deg);background:linear-gradient(90deg,transparent 15%,rgba(136,0,0,.75) 55%,transparent 88%);filter:blur(18px)}
.streak.d{top:62%;height:2px;transform:rotate(-24deg);background:linear-gradient(90deg,transparent 20%,rgba(255,255,255,.35) 58%,transparent 80%);opacity:.6}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,7,8,0) 40%,rgba(7,7,8,.75) 100%)}

.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px clamp(18px,3vw,28px)}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--red);display:grid;place-items:center;box-shadow:0 6px 20px -6px rgba(225,6,0,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.brand-mark svg{width:16px;height:16px;color:#fff}
.brand-name{white-space:nowrap;font-family:var(--f-display);font-stretch:118%;font-weight:700;font-size:15px;letter-spacing:.01em}
.badge{font-size:11.5px;font-weight:600;color:var(--amber);background:var(--amber-soft);border:1px solid rgba(242,184,56,.3);padding:2px 9px;border-radius:999px;margin-left:4px}
.nav-r{display:flex;align-items:center;gap:8px}
.olink{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--text);font-size:13.5px;font-weight:500;text-decoration:none;transition:border-color .3s,background .3s}
.olink svg,.olink img{width:16px;height:16px;flex:none;object-fit:contain}
.olink.dc svg{color:#8b95ff}
.olink:hover{border-color:var(--line-3);background:rgba(255,255,255,.09)}
.lang{display:flex;gap:4px;background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:999px;padding:4px}
.lang button{border:0;background:transparent;padding:5px 8px;border-radius:999px;cursor:pointer;display:grid;place-items:center;opacity:.45;transition:opacity .3s,background .3s}
.lang button svg{width:22px;height:15px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.lang button:hover{opacity:.85}
.lang button[aria-pressed="true"]{opacity:1;background:rgba(255,255,255,.1)}

.hero-body{text-align:center;padding:clamp(36px,7vw,84px) clamp(18px,4vw,40px) clamp(40px,6vw,64px);max-width:760px;margin:0 auto}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:999px;padding:5px 12px 5px 8px;margin-bottom:22px}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(242,184,56,.15)}
.hero h1{font-family:var(--f-display);font-stretch:120%;font-weight:700;font-size:clamp(32px,5.2vw,56px);line-height:1.04;letter-spacing:-.02em;margin:0 0 16px;text-wrap:balance}
.hero p.lede{color:var(--dim);font-size:17px;margin:0 auto 28px;max-width:52ch}
.search{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;background:rgba(14,14,16,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line-3);border-radius:999px;padding:6px 6px 6px 18px;transition:border-color .3s,box-shadow .3s}
.search:focus-within{border-color:var(--red-hi);box-shadow:0 0 0 4px var(--red-soft)}
.search svg{width:18px;height:18px;color:var(--dim);flex:none}
.search input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font:inherit;font-size:16px;padding:9px 0}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none}
.search input::-webkit-search-cancel-button{display:none}
.count{font-size:12.5px;font-weight:500;color:var(--dim);background:rgba(255,255,255,.07);padding:7px 12px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:16px}
.chips span{font-size:13px;color:var(--muted);align-self:center;margin-right:2px}
.chip{border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--dim);font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;transition:border-color .3s,color .3s,background .3s}
.chip:hover{border-color:var(--red-line);color:#fff;background:var(--red-soft)}

/* sections */
section.block{padding-block:clamp(48px,7vw,80px) 0}
.block-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.block-head h1,.block-head h2{font-family:var(--f-display);font-stretch:115%;font-weight:700;font-size:clamp(24px,3vw,30px);letter-spacing:-.015em;line-height:1.15;margin:0 0 6px}
.block-head p{margin:0;color:var(--muted);font-size:15.5px;max-width:58ch}

/* accès rapide */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px;min-height:100%;transition:border-color .35s var(--ease),transform .35s var(--ease),background .35s var(--ease)}
.tile:hover{border-color:var(--red-line);background:linear-gradient(180deg,rgba(225,6,0,.06),var(--s1) 60%);transform:translateY(-2px)}
.tile:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--red-soft);border:1px solid var(--red-line);color:var(--red-hi)}
.tile .ic svg{width:18px;height:18px}
.tile .ic.img{width:84px;height:84px;margin:-8px 0 -4px -8px;border:0;border-radius:50%;background:radial-gradient(circle at 50% 55%,rgba(225,6,0,.22),rgba(225,6,0,0) 68%)}
.tile .ic.img img{width:100%;height:100%;mix-blend-mode:lighten;transition:transform .45s var(--ease)}
.tile:hover .ic.img img{transform:scale(1.07) rotate(-2deg)}
.tile b{font-size:15.5px;font-weight:600;line-height:1.35}
.tile small{color:var(--muted);font-size:14px;line-height:1.5;flex:1}
.tile em{font-style:normal;font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}

/* liste */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;transition:background .3s,color .3s}
.tab:hover{color:var(--text)}
.tab[aria-pressed="true"]{background:var(--s3);color:#fff;box-shadow:inset 0 0 0 1px var(--line-2)}
.list{display:grid;gap:8px;margin-top:18px}
.now{margin:28px 0 8px;padding:18px 20px 8px;border-radius:20px;background:linear-gradient(180deg,rgba(225,6,0,.06),rgba(255,255,255,.015));border:1px solid var(--line-2)}
.now-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.now-head h2{margin:0;font-family:var(--f-display);font-stretch:112%;font-weight:700;font-size:20px;letter-spacing:-.01em}
.now-d{font-size:13px;color:var(--muted)}
.now-list{list-style:none;margin:0;padding:0}
.now-it{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.now-it:first-child{border-top:0}
.now-dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px;background:var(--lead)}
.now-it.ok .now-dot{background:var(--ok)}
.now-it.wip .now-dot{background:var(--known)}
.now-it p{flex:1;min-width:0;margin:0;font-size:14.5px;line-height:1.55;color:var(--dim);overflow-wrap:anywhere}
.now-it p b{color:var(--text);font-weight:600}
.now-go{flex:none;font-size:13px;color:var(--red-hi);text-decoration:none;white-space:nowrap;margin-top:2px}
.now-go:hover{text-decoration:underline}
.now-go:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px;border-radius:4px}
@media (max-width:560px){.now-it{flex-wrap:wrap}.now-it p{flex-basis:calc(100% - 21px)}.now-go{margin-left:21px;margin-top:-4px}}

.tn-notes{all:unset;box-sizing:border-box;position:relative;flex:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;margin-left:4px;border-radius:999px;font-size:14px;font-weight:500;color:var(--dim);transition:color .4s cubic-bezier(.32,.72,0,1),background .4s cubic-bezier(.32,.72,0,1)}
.tn-notes:hover{color:#fff;background:rgba(255,255,255,.06)}
.tn-notes:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.tn-nico{width:17px;height:17px;display:none}
.notes-btn.unseen::after{content:"";position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red-hi);box-shadow:0 0 0 3px rgba(225,6,0,.25)}
.foot-notes{position:relative;color:var(--dim);text-decoration:underline;text-underline-offset:3px;padding-right:12px}
.foot-notes.unseen::after{top:2px;right:0}
.notes-box{width:min(720px,100%)}
.nt-top{position:relative;padding:20px 64px 14px 22px;border-bottom:1px solid var(--line)}
.nt-top h2{margin:0;font-family:var(--f-display);font-stretch:115%;font-size:24px}
.nt-top p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.nt-x{all:unset;position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line-2)}
.nt-x:hover{color:#fff;box-shadow:inset 0 0 0 1px var(--line-3)}
.nt-x:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.nt-x svg{width:16px;height:16px}
.nt-list{max-height:min(560px,68vh);overflow-y:auto;padding:6px 22px 18px;scrollbar-width:thin}
.nt-list:focus-visible{outline:2px solid var(--red-hi);outline-offset:-4px}
.nt-ver{padding:16px 0 4px;border-bottom:1px solid var(--line)}
.nt-ver:last-child{border-bottom:0}

.share.ok{border-color:rgba(127,217,154,.5);color:var(--ok)}
.row.flash,.sup-it.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--red-hi),0 0 40px rgba(255,59,47,.35)}100%{box-shadow:none}}
.row{scroll-margin-top:120px}
.group{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;margin:18px 0 2px}
.group:first-child{margin-top:0}
.group svg{width:15px;height:15px;color:var(--red-hi)}
.row{background:var(--s1);border:1px solid var(--line);border-radius:16px;transition:border-color .3s}
.row:hover{border-color:var(--line-2)}
.row:has(details[open]){border-color:var(--red-line);background:linear-gradient(180deg,rgba(225,6,0,.05),var(--s1) 120px)}
.row summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px 12px 12px}
.row summary::-webkit-details-marker{display:none}
.chev{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--s3);border:1px solid var(--line-2);color:var(--dim);transition:transform .35s var(--ease),background .3s,color .3s}
.chev svg{width:14px;height:14px}
details[open] .chev{transform:rotate(90deg);background:var(--red);border-color:var(--red);color:#fff}
.row h3{margin:0;font-size:15.5px;font-weight:500;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.tag{font-size:12px;color:var(--dim);border:1px solid var(--line-2);background:rgba(255,255,255,.02);border-radius:999px;padding:3px 10px;white-space:nowrap;font-family:var(--mono)}
.st{font-family:var(--f);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);border-color:rgba(127,217,154,.28)}
.s-lead{color:var(--lead);border-color:rgba(143,182,255,.28)}
.s-known{color:var(--known);border-color:rgba(242,176,92,.3)}
.body{padding:2px 20px 20px 58px;display:grid;gap:12px;max-width:820px}
details[open] .body{animation:open .4s var(--ease)}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.body ol,.body ul{margin:0;padding-left:20px;display:grid;gap:7px;color:var(--dim)}
.body li::marker{color:var(--red-hi);font-weight:600;font-variant-numeric:tabular-nums}
.vid{width:100%;max-width:760px;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line-2);background:#000;display:block}
.tag.vtag{color:#fff;border-color:var(--red-line);background:var(--red-soft);font-family:var(--f);font-weight:600}
.note{margin:0;font-size:14.5px;color:var(--muted);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
code.p{font-family:var(--mono);font-size:.84em;background:var(--s3);color:#ffc2bc;border:1px solid var(--line);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--line-2);border-radius:16px;margin-top:18px}

/* avant de demander + liens */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.panel h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:16px;font-weight:600}
.panel h3 i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--s3);border:1px solid var(--line-2)}
.panel h3 i svg{width:15px;height:15px}
.panel.do h3 i{color:var(--ok)} .panel.dont h3 i{color:var(--red-hi)}
.panel ul{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--dim);font-size:15px}
.links{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:6px 22px}
.links div{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;padding-block:13px;border-bottom:1px solid var(--line)}
.links div:last-child{border-bottom:0}
.links b{font-weight:500;font-size:15px}
.links a{color:var(--red-hi);text-decoration:none;overflow-wrap:anywhere}
.links a:hover{text-decoration:underline}
.links span{font-size:15px;color:var(--dim);overflow-wrap:anywhere}

footer{margin-top:clamp(56px,8vw,96px);border-top:1px solid var(--line)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;padding-block:26px 44px;color:var(--muted);font-size:14px}
.foot b{color:var(--amber);font-weight:600}
.body a.lk,.note a.lk{color:var(--red-hi);overflow-wrap:anywhere;text-underline-offset:3px}
.foot a,.empty a{color:var(--red-hi);text-decoration:underline;text-underline-offset:3px}

@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){
  .hero{margin:10px 10px 0;border-radius:22px}
  .olink{width:40px;height:40px;padding:0;justify-content:center}
  .olink span{display:none}
  .nav-r{gap:6px}
  .badge{display:none}
  .row summary{grid-template-columns:32px minmax(0,1fr)}
  .tags{grid-column:2;justify-content:flex-start}
  .body{padding-left:20px}
  .duo{grid-template-columns:minmax(0,1fr)}
  .links div{grid-template-columns:minmax(0,1fr);gap:2px}
}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:14px;gap:6px}.tile small{display:none}.tile b{font-size:14.5px;line-height:1.3}.tile .ic.img{width:60px;height:60px;margin:-6px 0 -2px -6px}}

/* DA rotk.app : noir chaud, coins carrés, titres très gras en majuscules finis par un point, sur-titres rouges numérotés, libellés condensés. Le bandeau et le badge « non officiel » restent. */
:root{--bg:#0c0b09;--s1:#12110e;--s2:#181713;--s3:#211f1a;--line:rgba(255,240,210,.08);--line-2:rgba(255,240,210,.14);--line-3:rgba(255,240,210,.24);--text:#efede7;--dim:#c9c5ba;--muted:#928d81;--f-label:"Barlow Condensed","Arial Narrow",sans-serif}
:focus-visible{border-radius:2px}
main{counter-reset:sec}
.eb{display:block;font-family:var(--f-label);font-weight:700;font-size:13px;line-height:1.2;letter-spacing:.16em;text-transform:uppercase;color:var(--red-hi);margin-bottom:10px}
.eb::before{counter-increment:sec;content:counter(sec,decimal-leading-zero);color:var(--muted);margin-right:12px;letter-spacing:.06em}
.pt::after{content:"."}
.block-head h1,.block-head h2{font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:clamp(28px,4.4vw,52px);line-height:.95;letter-spacing:-.01em;margin:0 0 12px}
.block-head p{color:var(--muted)}
.skip{border-radius:2px}
/* bannière */
.hero{margin:0;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line-2);background:#0e0c0a}
.nav{max-width:1160px;margin:0 auto;padding:16px max(20px,env(safe-area-inset-left,0px))}
.brand-mark{border-radius:2px}
.brand-name{font-family:var(--f-label);font-stretch:normal;font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.06em}
.badge{border-radius:2px;font-family:var(--f-label);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;padding:2px 8px}
.olink{border-radius:2px;font-family:var(--f-label);font-weight:600;font-size:14.5px;text-transform:uppercase;letter-spacing:.08em}
.lang,.lang button{border-radius:2px}
/* drapeaux : cadre noir opaque (le rouge de la bannière ne passe plus derrière), drapeaux inactifs désaturés au lieu d'être transparents, langue active soulignée en rouge comme le menu */
.lang{background:rgba(12,11,9,.94);gap:2px;padding:4px}
.lang button{position:relative;opacity:1;filter:grayscale(.85) brightness(.72);transition:filter .3s cubic-bezier(.32,.72,0,1)}
.lang button svg{box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.lang button:hover{opacity:1;filter:grayscale(.2) brightness(.95)}
.lang button[aria-pressed="true"]{filter:none;background:none}
.lang button[aria-pressed="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--red)}
.lang button:focus-visible{outline:2px solid var(--red-hi);outline-offset:1px}
.hero-body{text-align:left;max-width:1160px;margin:0 auto;padding:clamp(30px,6vw,76px) max(20px,env(safe-area-inset-left,0px)) clamp(36px,6vw,64px)}
.kicker{background:none;border:0;border-radius:0;padding:0;margin-bottom:16px;font-family:var(--f-label);font-weight:700;font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--red-hi)}
.kicker i{display:none}
.kicker::before{content:"00";color:var(--muted);margin-right:4px;letter-spacing:.06em}
.hero h1{font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:clamp(36px,9.4vw,100px);line-height:.92;letter-spacing:-.015em;margin:0 0 18px;text-wrap:balance}
.hero p.lede{margin:0 0 28px;max-width:54ch}
.search-wrap{margin:0}
.search{margin:0;border-radius:2px;background:rgba(12,11,9,.8);padding:5px 5px 5px 16px}
.count{border-radius:2px;font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.chips{justify-content:flex-start}
.chips span{font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.chip{border-radius:2px}
.shot{border-radius:2px}
.hero-cta{display:table}
/* barre de navigation */
.tn-shell{border-radius:0;padding:0;background:none;box-shadow:none}
.topnav.stuck{top:0;padding:0}
.topnav.stuck .tn-shell{width:100%;background:none;box-shadow:0 18px 40px -22px rgba(0,0,0,.9)}
.tn-core{border-radius:0;padding:4px 6px;background:rgba(12,11,9,.9);box-shadow:inset 0 0 0 1px var(--line-2)}
.topnav.stuck .tn-core{justify-content:center;box-shadow:inset 0 -1px 0 var(--line-2)}
.tn-mark{border-radius:2px;background:var(--red)}
.tn-links a{border-radius:0;padding:10px 14px;font-family:var(--f-label);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.09em}
.tn-links a::before{inset:auto 14px 3px;height:2px;border-radius:0;background:var(--red);box-shadow:none}
.tn-notes{border-radius:0;font-family:var(--f-label);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.09em}
.tn-search{border-radius:2px;font-family:var(--f-label);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.09em}
.tn-ico,.tn-kbd{border-radius:2px}
/* état actuel */
.now{border-radius:0;background:var(--s1);border:1px solid var(--line-2);border-left:3px solid var(--red)}
.now-head h2{font-family:var(--f-label);font-stretch:normal;font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.08em}
.now-d{font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.now-go{font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
/* accès rapide */
.tile{border-radius:0}
.tile:hover{transform:none;background:var(--s2);border-color:var(--line-3);box-shadow:inset 3px 0 0 var(--red)}
.tile b{font-family:var(--f-label);font-weight:700;font-size:19px;line-height:1.15;text-transform:uppercase;letter-spacing:.05em}
.tile em{font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* onglets et fiches */
.tabs{border-radius:0;background:none;border:0;border-bottom:1px solid var(--line-2);padding:0;gap:0}
.tab{border-radius:0;padding:11px 16px;font-family:var(--f-label);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em}
.tab[aria-pressed="true"]{background:none;color:#fff;box-shadow:inset 0 -2px 0 var(--red)}
.group{font-family:var(--f-label);font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.12em}
.row{border-radius:0}
.row:has(details[open]){border-color:var(--line-3);background:var(--s1);box-shadow:inset 3px 0 0 var(--red)}
.chev{border-radius:2px}
.tag{border-radius:2px}
.st{font-family:var(--f-label);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.07em}
.tag.vtag{font-family:var(--f-label);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.07em}
.note{border-radius:0;border-left:2px solid var(--line-3)}
.vid{border-radius:0}
code.p{border-radius:2px}
/* cadres de code : un clic copie le texte, « Copié ✓ » s'affiche au-dessus du cadre */
code.p[role="button"]{cursor:pointer;transition:border-color .3s,color .3s}
code.p[role="button"]:hover{border-color:var(--red-line)}
code.p.ok,code.p[role="button"].ok{border-color:rgba(127,217,154,.5);color:var(--ok)} /* aussi sous le pointeur ou après un tap : plus fort que le :hover */
.chip-tip{position:absolute;z-index:40;left:0;top:0;pointer-events:none;padding:3px 9px;border-radius:2px;border:1px solid rgba(127,217,154,.5);background:var(--s2);color:var(--ok);font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .2s}
.chip-tip.ok{opacity:1}
.chip-tip.up{transform:translateY(-100%)}
.chip-tip.r{transform:translateX(-100%)}
.chip-tip.r.up{transform:translate(-100%,-100%)}
.share{justify-self:start;border-radius:2px;font-family:var(--f-label);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.07em}
.share:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.empty{border-radius:0}
.legend{font-family:var(--f-label);font-weight:500;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
/* parcours, dossier, panneaux */
.istep,.ftree,.ffind,.panel,.links{border-radius:0}
.istep h3,.ffind h3,.panel h3{font-family:var(--f-label);font-stretch:normal;font-weight:700;font-size:21px;line-height:1.15;text-transform:uppercase;letter-spacing:.04em}
.inum{border-radius:2px;font-family:var(--f-label);font-stretch:normal;font-size:17px}
.ilink{border-radius:2px}
/* « Voir aussi » en fin de fiche : les fiches citées dans le texte, en boutons comme ceux du parcours d'installation */
.also-h{margin:0;font-family:var(--f-label);font-weight:700;font-size:13.5px;line-height:1.2;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.also .ilinks{flex-direction:row;flex-wrap:wrap;margin-top:8px}
:lang(zh) .also-h{letter-spacing:.04em}
.nt-it .now-go{margin:0} /* « Voir la fiche » d'une patch note : à la suite du texte, sans le décalage de l'État actuel sur téléphone */
.fnode.game{border-radius:0}
.fbad,.fok{border-radius:2px;font-family:var(--f-label);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.07em}
.panel h3 i{border-radius:2px}
/* recherche, patch notes, support, captures */
.sug,.sg{border-radius:2px}
.pal-shell{border-radius:4px}
.pal-core,.pal-it{border-radius:2px}
.pal-h{font-family:var(--f-label);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.pal-esc,.pal-foot kbd,.nt-x,.nt-new,.nt-tag{border-radius:2px}
.nt-top h2{font-weight:900;font-stretch:125%;text-transform:uppercase}
.nt-new,.nt-tag{font-family:var(--f-label);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em}
.sup-search,.sup-it,.sup-copy,.sup-flag{border-radius:2px}
.dropzone div{border-radius:4px}
.ocr-prev img,.ocr-read pre{border-radius:2px}
.foot{flex-direction:column;align-items:flex-start;gap:8px}
/* images du site (icônes, illustrations) : ni glisser, ni sélection, ni menu « Enregistrer l'image » (le clic passe à la carte en dessous) */
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.tile .ic.img img,.iart,.fart,.olink img{pointer-events:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts .share{margin-top:0;text-decoration:none}
.share.rep{color:var(--red-hi);border-color:var(--red-line)}
.panel.do{border-color:rgba(127,217,154,.38)}
.panel.dont{border-color:var(--red-line)}
.panel.do h3 i{border-color:rgba(127,217,154,.38)}
.panel.dont h3 i{border-color:var(--red-line)}
.share.rep:hover{color:#fff;border-color:var(--red-hi);background:var(--red-soft)}
/* bouton X pour effacer la recherche (barre de recherche, fenêtre de recherche et Réponses rapides), affiché seulement quand il y a du texte. Le X natif du navigateur est masqué, il n'y en a qu'un. */
.clr{all:unset;box-sizing:border-box;flex:none;cursor:pointer;width:32px;height:32px;border-radius:2px;display:grid;place-items:center;color:var(--muted);transition:color .3s,background .3s}
.clr:hover{color:#fff;background:rgba(255,255,255,.07)}
.clr:focus-visible{outline:2px solid var(--red-hi);outline-offset:0}
.clr svg{width:16px;height:16px;color:inherit}
.search .clr{margin:0 -4px}
.sup-search .clr{margin-right:-8px}
.sup-search .count{margin:0 -8px 0 4px}
.empty .share{display:flex;width:max-content;max-width:100%;margin:14px auto 0}
/* Chinois : polices système seulement, aucune police téléchargée. Nos polices n'ont que le latin, les caractères chinois passent à YaHei (Windows), PingFang (Mac) ou Noto (Linux, Android). */
:root{--zh:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif}
:root:lang(zh){--f-display:"Archivo",var(--zh);--f:"Geist",var(--zh);--f-label:"Barlow Condensed",var(--zh);--mono:"Geist Mono",ui-monospace,Consolas,var(--zh)}
:lang(zh) .eb,:lang(zh) .kicker,:lang(zh) .badge,:lang(zh) .olink,:lang(zh) .chips span,:lang(zh) .tn-links a,:lang(zh) .tn-notes,:lang(zh) .tn-search,:lang(zh) .now-head h2,:lang(zh) .now-go,:lang(zh) .tab,:lang(zh) .group,:lang(zh) .pal-h{letter-spacing:.04em}
:lang(zh) .hero h1,:lang(zh) .block-head h1,:lang(zh) .block-head h2{line-height:1.15;letter-spacing:0}
:lang(zh) .pt::after{content:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
